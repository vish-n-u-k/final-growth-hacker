<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module Slider Concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --card-2:#f9fafb; --line:#e5e7eb;
    --green:#16a34a; --green-strong:#15803d; --green-tint:#f0fdf4;
    --text:#111827; --text-dim:#6b7280; --text-faint:#9ca3af;
    --locked-border:#e5e7eb; --locked-bg:#f3f4f6;
    --amber-bg:#fffbeb; --amber-border:#fde68a; --amber-text:#92400e; --amber-icon:#d97706;
    --header-bg:#0d2218; --header-accent:#4ade80; --header-sub:#6ee7b7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Outfit',-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Fraunces',serif;}
  a{color:var(--green-strong); text-decoration:none;}
  button{font-family:inherit;}

  /* ── header ── */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; background:var(--header-bg); gap:16px; flex-wrap:wrap;
  }
  .logo{display:flex; align-items:center; gap:10px; font-weight:700; font-size:19px; letter-spacing:-.3px; color:#ffffff;}
  .logo .mark{width:28px; height:28px; border-radius:8px; background:var(--header-accent); flex-shrink:0;}
  .mode-toggle{display:flex; gap:2px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:9px; padding:3px;}
  .mode-toggle button{
    padding:7px 14px; border:none; background:transparent; color:var(--header-sub);
    font-size:12.5px; font-weight:600; border-radius:7px; cursor:pointer; transition:background .15s, color .15s;
  }
  .mode-toggle button.active{background:rgba(255,255,255,.14); color:#ffffff;}

  /* ── stepper rail ── */
  .rail-outer{padding:22px 0 18px; border-bottom:1px solid var(--line); background:var(--card); overflow-x:auto;}
  .rail-outer::-webkit-scrollbar{height:0;}
  .rail{position:relative; max-width:1280px; margin:0 auto; padding:0 40px; min-width:880px;}
  .rail-line{position:absolute; top:17px; left:40px; right:40px; height:2px; background:var(--locked-border);}
  .rail-progress{position:absolute; top:17px; left:40px; height:2px; background:var(--green); transition:width .2s;}
  .rail-steps{position:relative; display:flex; justify-content:space-between;}
  .step{display:flex; flex-direction:column; align-items:center; gap:6px; width:62px; background:transparent; border:none; cursor:pointer; padding:0;}
  .step[disabled]{cursor:default;}
  .step .dot{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-size:12px; font-weight:700; transition:background .15s, border-color .15s;
  }
  .step .lbl{font-size:10px; text-align:center; line-height:1.25; transition:color .15s;}

  /* ── main ── */
  main{max-width:720px; width:100%; margin:0 auto; padding:36px 24px 120px; position:relative;}
  .step-eyebrow{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin:0 0 6px;}
  .mod-head{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:6px;}
  .mod-head h1{font-size:28px; margin:0; color:var(--text);}
  .mod-actions{display:flex; align-items:center; gap:16px;}
  .reanalyse{padding:8px 15px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:13px; font-weight:600; cursor:pointer;}
  .ring-wrap{position:relative; width:68px; height:68px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:var(--text);}
  .mod-desc{color:var(--text-dim); font-size:14px; line-height:1.6; margin:0 0 22px;}

  .unlock-bar{margin-bottom:26px; padding:13px 16px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card-2);}
  .unlock-bar .row{display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:8px;}
  .unlock-bar .row b{color:var(--text);}
  .track{position:relative; height:6px; border-radius:99px; background:var(--locked-border);}
  .track .fill{position:absolute; left:0; top:0; height:6px; border-radius:99px; background:var(--green); transition:width .2s;}
  .track .marker{position:absolute; left:80%; top:-3px; width:2px; height:12px; background:var(--text-faint);}

  .cat{margin-bottom:9px; border:1px solid var(--line); border-radius:12px; background:var(--card); overflow:hidden;}
  .cat-head{width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; background:transparent; border:none; cursor:pointer; text-align:left; color:inherit;}
  .cat-head .name{flex:1; font-size:14px; font-weight:600; color:var(--text);}
  .cat-head .count{font-size:11.5px; color:var(--text-faint);}
  .cat-head svg{transition:transform .15s; flex-shrink:0;}
  .cat.open .cat-head svg{transform:rotate(180deg);}
  .cat-body{padding:0 16px 14px; display:none; flex-direction:column; gap:11px;}
  .cat.open .cat-body{display:flex;}
  .item{display:flex; align-items:flex-start; gap:10px;}
  .item .box{width:15px; height:15px; border-radius:4px; border:1.5px solid var(--locked-border); flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; background:var(--card);}
  .item .box.done{border-color:var(--green); background:var(--green);}
  .item .label{font-size:13px; color:var(--text);}
  .item .note{font-size:11.5px; color:var(--text-faint); margin-top:2px;}

  .locked-panel{text-align:center; padding:70px 20px; color:var(--text-faint);}
  .locked-panel svg{margin-bottom:14px;}
  .locked-panel .t{font-size:15px; color:var(--text-dim); margin-bottom:6px;}

  /* ── carousel nav (desktop) ── */
  .arrow{
    position:fixed; top:50%; transform:translateY(-50%); width:48px; height:48px; border-radius:50%;
    background:var(--card); border:1px solid var(--line); box-shadow:0 2px 8px rgba(17,24,39,.08); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .arrow.prev{left:24px;} .arrow.next{right:24px;}
  .arrow[disabled]{opacity:.35; cursor:default; box-shadow:none;}
  .lock-badge{position:absolute; bottom:-3px; right:-3px; width:17px; height:17px; border-radius:50%; background:var(--amber-bg); border:1px solid var(--amber-border); display:flex; align-items:center; justify-content:center;}

  .toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--amber-bg); border:1px solid var(--amber-border);
    padding:11px 18px; border-radius:10px; font-size:13px; color:var(--amber-text); display:flex; align-items:center; gap:14px;
    box-shadow:0 12px 28px rgba(17,24,39,.14); opacity:0; pointer-events:none; transition:opacity .15s; z-index:30;
  }
  .toast.show{opacity:1; pointer-events:auto;}
  .toast button{background:transparent; border:none; color:var(--amber-text); font-size:15px; cursor:pointer; opacity:.7;}

  /* ── bottom bar (mobile) ── */
  .bottombar{display:none; position:fixed; left:0; right:0; bottom:0; border-top:1px solid var(--line); background:var(--card);}
  .bottombar button{flex:1; padding:15px; background:transparent; border:none; color:var(--text-dim); font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px;}
  .bottombar button[disabled]{color:var(--text-faint); opacity:.5;}
  .bottombar .divider{width:1px; background:var(--line);}

  @media (max-width: 820px){
    .arrow{display:none;}
    .bottombar{display:flex;}
    main{padding-bottom:90px;}
  }

  /* ── "Today" accordion view ── */
  #today-view{display:none; max-width:880px; margin:0 auto; padding:40px 24px 100px;}
  #today-view h1{font-size:26px; margin:0 0 6px; color:var(--text);}
  #today-view .sub{color:var(--text-dim); font-size:14px; margin:0 0 28px; line-height:1.6;}
  .trow{margin-bottom:10px; border:1px solid var(--line); border-radius:12px; background:var(--card); overflow:hidden;}
  .trow.open{border-color:var(--green);}
  .trow-head{width:100%; display:flex; align-items:center; gap:14px; padding:16px 18px; background:transparent; border:none; cursor:pointer; text-align:left; color:inherit;}
  .trow-head .num{width:26px; height:26px; border-radius:50%; background:var(--green-tint); color:var(--green-strong); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}
  .trow.locked{opacity:.55;}
  .trow.locked .num{background:var(--locked-bg); color:var(--text-faint);}
  .trow-head .main{flex:1; min-width:0;}
  .trow-head .name{font-size:15px; font-weight:600; color:var(--text);}
  .trow-head .sub{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .trow-head .score{font-size:13px; font-weight:600; color:var(--text-dim);}
  .trow-head svg{transition:transform .15s; flex-shrink:0;}
  .trow.open .trow-head svg{transform:rotate(180deg);}
  .trow-body{display:none; padding:0 18px 16px 58px; flex-direction:column; gap:9px;}
  .trow.open .trow-body{display:flex;}
  .trow-body .line{font-size:12.5px; color:var(--text-dim); display:flex; gap:9px; align-items:flex-start;}
  .trow-body .chk{width:14px; height:14px; border-radius:4px; border:1.5px solid var(--locked-border); flex-shrink:0; margin-top:1px;}
  .more-note{margin-top:26px; padding:13px 18px; border:1px dashed var(--locked-border); border-radius:12px; font-size:12px; color:var(--text-faint); text-align:center;}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="mark"></div>GrowJin</div>
  <div class="mode-toggle">
    <button id="btn-proposed" class="active">Proposed</button>
    <button id="btn-today">Today</button>
  </div>
</header>

<!-- ============ PROPOSED SLIDER ============ -->
<div id="proposed-view">
  <div class="rail-outer">
    <div class="rail">
      <div class="rail-line"></div>
      <div class="rail-progress" id="rail-progress"></div>
      <div class="rail-steps" id="rail-steps"></div>
    </div>
  </div>

  <main id="main-panel"></main>

  <button class="arrow prev" id="arrow-prev" aria-label="Previous module">
    <svg width="17" height="17" viewBox="0 0 24 24"><polyline points="15,6 9,12 15,18" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="arrow next" id="arrow-next" aria-label="Next module">
    <svg width="17" height="17" viewBox="0 0 24 24"><polyline points="9,6 15,12 9,18" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="lock-badge" id="next-lock-badge">
      <svg width="8" height="8" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="#92400e" stroke-width="2.6"/><path d="M8,11 V8 a4,4 0 0 1 8,0 V11" fill="none" stroke="#92400e" stroke-width="2.6"/></svg>
    </span>
  </button>

  <div class="bottombar">
    <button id="bb-prev">
      <svg width="13" height="13" viewBox="0 0 24 24"><polyline points="15,6 9,12 15,18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Prev
    </button>
    <div class="divider"></div>
    <button id="bb-next">Next</button>
  </div>

  <div class="toast" id="toast">
    <span id="toast-text"></span>
    <button id="toast-close">✕</button>
  </div>
</div>

<!-- ============ TODAY (ACCORDION) VIEW ============ -->
<div id="today-view">
  <h1 class="display">Your growth modules</h1>
  <p class="sub">All 16 modules live on this one page today. Click a row to expand it — scroll keeps going past locked modules below.</p>
  <div id="today-rows"></div>
  <div class="more-note">↓ 11 more modules continue below, same pattern ↓</div>
</div>

<script>
const MODULES = [
  { id:1, name:'Foundation', railLabel:'Foundation', sub:'Always unlocked', score:62, desc:'Site basics — HTTPS, analytics, trust signals. Always unlocked, no prerequisites.', unlockNext:'Website Audit',
    cats:[
      { name:'Technical', open:true, items:[
        { label:'HTTPS / SSL active', note:'Valid certificate, auto-renews', done:true },
        { label:'Mobile viewport tag present', note:'Found in <head>', done:true },
        { label:'GA4 or GTM detected on homepage', note:'gtag.js found', done:true },
        { label:'No noindex tag found', note:'Homepage is indexable', done:false },
      ]},
      { name:'Analytics & Search', open:false, items:[
        { label:'Google Search Console verified', note:'Meta tag present', done:true },
        { label:'PostHog installed', note:'Not detected on homepage', done:false },
      ]},
      { name:'Trust & Conversion', open:false, items:[
        { label:'Privacy policy link in footer', note:'Linked from footer', done:true },
        { label:'Contact information visible', note:'No contact page or email found', done:false },
        { label:'Favicon present', note:'32×32 favicon.svg found', done:true },
      ]},
    ]},
  { id:2, name:'Website Audit', railLabel:'Website Audit', sub:'Unlocked — Foundation ≥ 70%', score:34, desc:'UX, navigation, speed, and mobile friendliness. Unlocked because Foundation reached 80%.', unlockNext:'SEO Audit',
    cats:[
      { name:'UX & UI', open:true, items:[
        { label:'Title tag length (30–60 chars)', note:'Currently 71 characters — too long', done:false },
        { label:'Exactly one H1 per page', note:'Found 1 H1', done:true },
        { label:'Viewport meta tag present', note:'Found in <head>', done:true },
      ]},
      { name:'Navigation & Structure', open:false, items:[
        { label:'Nav landmark present', note:'<nav> element found', done:true },
        { label:'Descriptive anchor text', note:'4 links use "click here"', done:false },
      ]},
      { name:'Page Speed', open:false, items:[
        { label:'Server response time < 200ms', note:'Currently 340ms TTFB', done:false },
        { label:'Images have width/height attributes', note:'12 of 18 images missing', done:false },
      ]},
    ]},
];
const LOCKED_LABELS = ['SEO','GEO','Comp. Gap','Social','Brand','Content','Competitors','Outreach','Meta Ads','Analytics','Targets','Stage','Email','Audience'];
const TOTAL_STEPS = 2 + LOCKED_LABELS.length;

let currentStep = 1;
const openCatByStep = {};

function stepInfo(num){
  if (num <= MODULES.length) return { label: MODULES[num-1].railLabel, data: MODULES[num-1] };
  return { label: LOCKED_LABELS[num - MODULES.length - 1], data: null };
}

function renderRail(){
  const rail = document.getElementById('rail-steps');
  rail.innerHTML = '';
  for (let n = 1; n <= TOTAL_STEPS; n++){
    const info = stepInfo(n);
    const isDone = n < currentStep;
    const isCurrent = n === currentStep;
    const isLocked = n > currentStep;
    const btn = document.createElement('button');
    btn.className = 'step';
    btn.disabled = isLocked;
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.background = isDone ? 'var(--green)' : (isCurrent ? '#ffffff' : 'var(--locked-bg)');
    dot.style.border = isCurrent ? '2px solid var(--green)' : (isDone ? '2px solid var(--green)' : '1px solid var(--locked-border)');
    if (isDone){
      dot.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    } else if (isLocked){
      dot.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="#9ca3af" stroke-width="2"/><path d="M8,11 V8 a4,4 0 0 1 8,0 V11" fill="none" stroke="#9ca3af" stroke-width="2"/></svg>';
    } else {
      dot.style.fontSize = '12px'; dot.style.fontWeight = '700'; dot.style.color = 'var(--green-strong)';
      dot.textContent = n;
    }
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.style.color = isCurrent ? 'var(--text)' : (isDone ? 'var(--text-dim)' : 'var(--text-faint)');
    lbl.style.fontWeight = isCurrent ? '600' : '400';
    lbl.textContent = info.label;
    btn.appendChild(dot); btn.appendChild(lbl);
    if (!isLocked){
      btn.addEventListener('click', () => { currentStep = n; render(); });
    } else {
      btn.addEventListener('click', () => showToast(`Reach 80% on "${stepInfo(n-1).label}" to unlock ${info.label}`));
    }
    rail.appendChild(btn);
  }
  document.getElementById('rail-progress').style.width = ((currentStep - 1) / (TOTAL_STEPS - 1) * 100) + '%';
}

function ringSvg(score){
  const C = 2 * Math.PI * 40;
  const offset = C * (1 - score / 100);
  return `<svg width="68" height="68" viewBox="0 0 92 92">
    <circle cx="46" cy="46" r="40" fill="none" stroke="var(--locked-border)" stroke-width="8"/>
    <circle cx="46" cy="46" r="40" fill="none" stroke="var(--green)" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${C} ${C}" stroke-dashoffset="${offset}"/>
  </svg>`;
}

function renderMain(){
  const panel = document.getElementById('main-panel');
  const info = stepInfo(currentStep);

  if (!info.data){
    panel.innerHTML = `
      <p class="step-eyebrow">Step ${currentStep} of ${TOTAL_STEPS}</p>
      <div class="locked-panel">
        <svg width="34" height="34" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="#9ca3af" stroke-width="2"/><path d="M8,11 V8 a4,4 0 0 1 8,0 V11" fill="none" stroke="#9ca3af" stroke-width="2"/></svg>
        <div class="t">${info.label} is locked</div>
        <div>Reach 80% on the previous module to unlock it.</div>
      </div>`;
    return;
  }

  const mod = info.data;
  const openIdx = openCatByStep[mod.id] ?? mod.cats.findIndex(c => c.open);

  panel.innerHTML = `
    <p class="step-eyebrow">Step ${currentStep} of ${TOTAL_STEPS}</p>
    <div class="mod-head">
      <h1 class="display">${mod.name}</h1>
      <div class="mod-actions">
        <button class="reanalyse">Re-analyse</button>
        <div class="ring-wrap">${ringSvg(mod.score)}<div class="ring-pct">${mod.score}%</div></div>
      </div>
    </div>
    <p class="mod-desc">${mod.desc}</p>
    <div class="unlock-bar">
      <div class="row"><span>Reach <b>80%</b> to unlock ${mod.unlockNext}</span><b>${mod.score}% / 80%</b></div>
      <div class="track"><div class="fill" style="width:${mod.score}%"></div><div class="marker"></div></div>
    </div>
    <div id="cats"></div>
  `;

  const catsEl = panel.querySelector('#cats');
  mod.cats.forEach((cat, i) => {
    const isOpen = i === openIdx;
    const doneCount = cat.items.filter(it => it.done).length;
    const row = document.createElement('div');
    row.className = 'cat' + (isOpen ? ' open' : '');
    row.innerHTML = `
      <button class="cat-head">
        <div class="name">${cat.name}</div>
        <div class="count">${doneCount}/${cat.items.length}</div>
        <svg width="14" height="14" viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9" fill="none" stroke="#9ca3af" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="cat-body">
        ${cat.items.map(it => `
          <div class="item">
            <div class="box${it.done ? ' done' : ''}">${it.done ? '<svg width="9" height="9" viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</div>
            <div><div class="label">${it.label}</div><div class="note">${it.note}</div></div>
          </div>`).join('')}
      </div>
    `;
    row.querySelector('.cat-head').addEventListener('click', () => {
      openCatByStep[mod.id] = (openCatByStep[mod.id] === i) ? -1 : i;
      renderMain();
    });
    catsEl.appendChild(row);
  });
}

function renderArrows(){
  const prev = document.getElementById('arrow-prev');
  const next = document.getElementById('arrow-next');
  const bbPrev = document.getElementById('bb-prev');
  const bbNext = document.getElementById('bb-next');
  const atFirst = currentStep === 1;
  prev.disabled = atFirst; bbPrev.disabled = atFirst;
  const info = stepInfo(currentStep);
  const canAdvance = info.data && info.data.score >= 80;
  document.getElementById('next-lock-badge').style.display = canAdvance ? 'none' : 'flex';
}

function showToast(text){
  document.getElementById('toast-text').textContent = text;
  document.getElementById('toast').classList.add('show');
}
function hideToast(){ document.getElementById('toast').classList.remove('show'); }

function goPrev(){ if (currentStep > 1){ currentStep--; render(); } }
function goNext(){
  const info = stepInfo(currentStep);
  if (info.data && info.data.score >= 80 && currentStep < TOTAL_STEPS){ currentStep++; render(); }
  else { const nxt = stepInfo(currentStep + 1); showToast(`Reach 80% on "${info.label}" to unlock ${nxt ? nxt.label : 'the next module'}`); }
}

function render(){ renderRail(); renderMain(); renderArrows(); hideToast(); }

document.getElementById('arrow-prev').addEventListener('click', goPrev);
document.getElementById('arrow-next').addEventListener('click', goNext);
document.getElementById('bb-prev').addEventListener('click', goPrev);
document.getElementById('bb-next').addEventListener('click', goNext);
document.getElementById('toast-close').addEventListener('click', hideToast);

render();

/* ── Today view ── */
const TODAY_ROWS = [
  { num:1, name:'Foundation', sub:'Always unlocked', score:'62%', open:true, items:['HTTPS / SSL active','GA4 or GTM detected on homepage','Privacy policy link found in footer','Mobile viewport tag present'] },
  { num:2, name:'Website Audit', sub:'Unlocked — Foundation ≥ 70%', score:'34%', open:false, items:['Title tag length check','Nav landmark present','Server response time'] },
  { num:3, name:'SEO Audit', sub:'Locked — unlocks at Website Audit 80%', score:'Locked', locked:true, items:[] },
  { num:4, name:'GEO Audit', sub:'Locked', score:'Locked', locked:true, items:[] },
  { num:5, name:'Social Media Audit', sub:'Locked', score:'Locked', locked:true, items:[] },
];
function renderToday(){
  const wrap = document.getElementById('today-rows');
  wrap.innerHTML = '';
  TODAY_ROWS.forEach(r => {
    const row = document.createElement('div');
    row.className = 'trow' + (r.open ? ' open' : '') + (r.locked ? ' locked' : '');
    row.innerHTML = `
      <button class="trow-head">
        <div class="num">${r.num}</div>
        <div class="main"><div class="name">${r.name}</div><div class="sub">${r.sub}</div></div>
        <div class="score">${r.score}</div>
        <svg width="15" height="15" viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9" fill="none" stroke="#9ca3af" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="trow-body">${r.items.map(i => `<div class="line"><div class="chk"></div>${i}</div>`).join('')}</div>
    `;
    row.querySelector('.trow-head').addEventListener('click', () => { row.classList.toggle('open'); });
    wrap.appendChild(row);
  });
}
renderToday();

/* ── mode toggle ── */
document.getElementById('btn-proposed').addEventListener('click', () => {
  document.getElementById('proposed-view').style.display = '';
  document.getElementById('today-view').style.display = 'none';
  document.getElementById('btn-proposed').classList.add('active');
  document.getElementById('btn-today').classList.remove('active');
});
document.getElementById('btn-today').addEventListener('click', () => {
  document.getElementById('proposed-view').style.display = 'none';
  document.getElementById('today-view').style.display = '';
  document.getElementById('btn-today').classList.add('active');
  document.getElementById('btn-proposed').classList.remove('active');
});
</script>
</body>
</html>
