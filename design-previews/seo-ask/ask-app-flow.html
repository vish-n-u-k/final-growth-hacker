<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrowJin as an Ask app: the whole flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Storyboard: a step bar on top, the app on the left, "what happens behind" on the right.
     App rules: one green button per screen, red only for replies, grey everywhere else. */
  :root {
    --bg: #ffffff; --soft: #f3f5f3; --line: #e3e7e3; --text: #16201a; --dim: #4f5c53; --faint: #86918a;
    --green: #15803d; --green-ink: #0f5a2b; --green-soft: #e6f3ea; --red: #b42318; --red-soft: #fdeceb;
    --warn: #b45309; --pick: #eef0ee; --bar: #c9d3cb; --bar2: #9aa79e;
    --display: 'Fraunces', Georgia, serif; --body: 'Outfit', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #0f1411; --soft: #171e19; --line: #26302a; --text: #e9eee9; --dim: #b3bdb5; --faint: #7f8a82;
    --green: #22a35a; --green-ink: #7fd8a2; --green-soft: #15291c; --red: #f87b70; --red-soft: #361a17;
    --warn: #f0a24a; --pick: #1c241f; --bar: #3a463e; --bar2: #5d6b61; color-scheme: dark } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--pick); color: var(--text); font: 400 15px/1.5 var(--body); }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  /* Step bar (not part of the app) */
  .story { position: sticky; top: 0; z-index: 5; background: var(--pick); border-bottom: 1px solid var(--line);
    padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  .story-in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .story-h { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .stepbar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .stepbar::-webkit-scrollbar { display: none; }
  .st { display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 13.5px; cursor: pointer; white-space: nowrap; color: var(--dim); }
  .st b { width: 20px; height: 20px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 11.5px; font-weight: 600; color: var(--faint); }
  .st[aria-current="step"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .st[aria-current="step"] b { background: var(--bg); color: var(--text); }
  .st.seen b { background: var(--green-soft); color: var(--green-ink); }
  .navs { display: flex; gap: 6px; }
  .nb { height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 13.5px; }

  .stage { max-width: 1280px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  @media (max-width: 980px) { .stage { grid-template-columns: 1fr; } }

  /* The app window */
  .win { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.06); min-height: 680px; display: flex; flex-direction: column; }
  .chrome { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--soft); }
  .chrome i { width: 10px; height: 10px; border-radius: 50%; background: var(--bar); }
  .url { margin-left: 10px; padding: 3px 12px; border-radius: 7px; background: var(--bg); font-size: 12.5px; color: var(--faint); }
  .body { flex: 1; display: flex; min-height: 0; }
  .side { width: 200px; flex: none; background: var(--soft); border-right: 1px solid var(--line); padding: 16px 10px; font-size: 13.5px; }
  .logo { padding: 2px 8px 18px; font: 600 16px var(--display); }
  .nav { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; color: var(--dim); cursor: default; }
  .nav.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
  .nav svg { color: var(--faint); }
  .gl { padding: 16px 10px 4px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .nav.sub { padding-left: 33px; font-size: 13px; }
  .nav.sub.on { box-shadow: none; background: none; color: var(--text); }
  @media (max-width: 700px) { .side { display: none; } }
  .main { flex: 1; min-width: 0; overflow: auto; }
  .col { max-width: 720px; margin: 0 auto; padding: 30px 22px 60px; animation: up .3s ease both; }
  @keyframes up { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  /* Behind the scenes */
  .behind { position: sticky; top: 74px; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 8px; }
  .behind h2 { margin: 0 0 2px; font: 600 18px/1.25 var(--display); }
  .behind .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .behind ul { margin: 12px 0 0; padding: 0; list-style: none; }
  .behind li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--dim); }
  .behind li b { color: var(--text); font-weight: 600; }
  .behind code { font-size: 12.5px; background: var(--soft); padding: 1px 5px; border-radius: 5px; }
  @media (max-width: 980px) { .behind { position: static; } }

  /* Shared app bits */
  h1 { margin: 0; font: 600 30px/1.15 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  .sub { margin: 8px 0 0; color: var(--faint); font-size: 15px; }
  .eyebrow { display: block; margin-bottom: 5px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .btn { height: 42px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn.go { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.go:hover { filter: brightness(1.06); }
  .link { border: 0; background: none; padding: 0; color: var(--dim); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; font-size: 14px; }
  .back { border: 0; background: none; padding: 0; color: var(--faint); font-size: 14px; cursor: pointer; margin-bottom: 18px; }
  .back:hover { color: var(--text); }

  /* Onboarding */
  .ob { max-width: 460px; margin: 0 auto; padding: 9vh 22px 40px; animation: up .3s ease both; }
  .ob-n { font-size: 13px; color: var(--faint); margin-bottom: 10px; }
  .field { display: flex; gap: 8px; margin-top: 22px; }
  .field input { flex: 1; min-width: 0; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); font-size: 16px; }
  .conn { margin-top: 20px; }
  .crow { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .crow-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--soft); display: grid; place-items: center; color: var(--dim); flex: none; }
  .crow-main { flex: 1; min-width: 0; }
  .crow-main b { display: block; font-weight: 600; }
  .crow-main span { font-size: 13.5px; color: var(--faint); }
  .cbtn { height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 13.5px; cursor: pointer; }
  .cbtn.done { border-color: transparent; color: var(--green-ink); cursor: default; }
  .ob-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 26px; }
  .steps { list-style: none; margin: 22px 0 0; padding: 0; }
  .steps li { display: flex; align-items: center; gap: 10px; padding: 7px 0; color: var(--faint); transition: color .2s; }
  .steps li.on { color: var(--text); } .steps li.done { color: var(--dim); }
  .steps li small { margin-left: auto; color: var(--faint); font-size: 13px; }
  .tick { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
  .on .tick { border-color: var(--bar2); border-top-color: var(--green); animation: spin .8s linear infinite; }
  .done .tick { border-color: var(--green); background: var(--green); }
  .done .tick::after { content: ''; width: 6px; height: 3px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .learned { margin-top: 22px; border: 1px solid var(--line); border-radius: 14px; padding: 4px 18px; animation: up .3s ease both; }
  .lr { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .lr:last-child { border-bottom: 0; }
  .lr span { color: var(--faint); }

  /* Ask bar */
  .ask { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 7px 0 16px; border: 1px solid var(--line); border-radius: 15px; background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 22px rgba(0,0,0,.05); margin-top: 20px; }
  .ask svg { flex: none; color: var(--faint); }
  .ask input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; }
  .ask input::placeholder { color: var(--faint); }
  .ask-go { height: 40px; width: 40px; flex: none; border-radius: 11px; border: 0; background: var(--soft); color: var(--dim); cursor: pointer; display: grid; place-items: center; }
  .ask.small { height: 46px; box-shadow: none; margin-top: 30px; }
  .hint { margin-top: 10px; font-size: 13.5px; color: var(--faint); }
  .hint b { color: var(--dim); font-weight: 500; }

  /* Home cards */
  .reply-row { display: flex; align-items: center; gap: 14px; margin-top: 22px; padding: 16px 18px; border-radius: 14px; background: var(--red-soft); cursor: pointer; border: 0; width: 100%; text-align: left; }
  .reply-row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex: none; }
  .reply-row b { display: block; font-weight: 600; }
  .reply-row span.s { font-size: 14px; color: var(--dim); }
  .reply-row .go { margin-left: auto; color: var(--dim); font-size: 14px; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .card { display: flex; flex-direction: column; gap: 8px; min-height: 140px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); text-align: left; cursor: pointer; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--bar2); transform: translateY(-1px); }
  .card .t { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
  .card .n { margin-top: auto; font: 600 28px/1 var(--display); }
  .card .n small { font: 400 13px var(--body); color: var(--faint); margin-left: 5px; }
  .card .ch { font-size: 12.5px; color: var(--faint); }
  .card.off { cursor: default; opacity: .7; }
  .card.off .n { font: 500 14px var(--body); color: var(--faint); }
  .card.new { border-color: var(--bar2); }
  .since { margin-top: 26px; padding: 14px 16px; border-radius: 12px; background: var(--soft); font-size: 14px; color: var(--dim); }
  .since b { color: var(--text); font-weight: 600; }

  /* Answer */
  .short { margin: 12px 0 0; font-size: 18px; line-height: 1.55; color: var(--dim); max-width: 60ch; }
  .short b { color: var(--text); font-weight: 600; }
  .fig { margin-top: 22px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; }
  .fig-h { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; color: var(--faint); }
  .fig-h b { color: var(--text); font-weight: 600; font-size: 14px; }
  .fig svg { display: block; width: 100%; height: auto; overflow: visible; }
  .fig svg text { font-family: var(--body); }
  .next { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 20px; padding: 18px 20px; border-radius: 14px; background: var(--green-soft); }
  .next-t { flex: 1 1 240px; min-width: 0; }
  .next-t b { display: block; font-size: 16.5px; font-weight: 600; }
  .next-t .s { color: var(--dim); font-size: 14px; }
  .then { margin-top: 18px; }
  .then-h { margin: 0; font-size: 13px; color: var(--faint); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .row-n { width: 22px; height: 22px; flex: none; border-radius: 50%; background: var(--soft); color: var(--faint); font-size: 12px; display: grid; place-items: center; }
  .row b { display: block; font-weight: 500; }
  .row span.w { display: block; color: var(--faint); font-size: 13.5px; }
  .src { margin-top: 16px; font-size: 13px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .list { font-size: 14px; }
  .li { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); }
  .li:first-child { border-top: 0; }
  .li b { font-weight: 600; } .li span { color: var(--faint); text-align: right; }
  .posts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .post { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .post .img { aspect-ratio: 1; display: grid; place-items: center; font: 600 15px/1.2 var(--display); text-align: center; padding: 12px; color: var(--text); }
  .post .cap { padding: 8px 10px; font-size: 12.5px; color: var(--dim); }
  .bigs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .bigs b { display: block; font: 600 26px/1.1 var(--display); }
  .bigs span { font-size: 12.5px; color: var(--faint); }
  .bigs em { font-style: normal; font-size: 13px; color: var(--green-ink); font-weight: 600; margin-left: 4px; font-family: var(--body); }

  /* Live answer for a typed question */
  .live { margin-top: 18px; }
  .tool { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; color: var(--faint); }
  .tool code { font-size: 12.5px; background: var(--soft); padding: 2px 6px; border-radius: 6px; color: var(--dim); }
  .tool.on { color: var(--text); } .tool.done { color: var(--dim); }

  /* Tool screen (hand-off) */
  .crumb { font-size: 13px; color: var(--faint); margin-bottom: 14px; }
  .crumb b { color: var(--dim); font-weight: 500; }
  .lead { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 22px; margin-top: 18px; }
  @media (max-width: 760px) { .lead { grid-template-columns: 1fr; } }
  .facts { font-size: 14px; }
  .fact { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .fact span { color: var(--faint); }
  .mail { border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .mail .to { font-size: 13.5px; color: var(--faint); margin-bottom: 8px; }
  .mail .to b { color: var(--text); font-weight: 500; }
  .mail .subj { font-weight: 600; margin-bottom: 8px; }
  .mail textarea { width: 100%; min-height: 170px; border: 0; resize: vertical; background: none; font-size: 14.5px; line-height: 1.55; outline: none; padding: 0; }
  .acts { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .count { margin-left: auto; font-size: 13px; color: var(--faint); }
  .brief { margin-top: 18px; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; font-size: 14.5px; }
  .brief ol { margin: 8px 0 0; padding-left: 20px; }
  .brief li { margin: 6px 0; color: var(--dim); }
  .brief li b { color: var(--text); font-weight: 600; }
  .brief pre { margin: 10px 0 0; padding: 10px 12px; background: var(--soft); border-radius: 9px; font-size: 12.5px; white-space: pre-wrap; }
  .thread-msg { margin-top: 14px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); font-size: 14.5px; }
  .thread-msg.them { border-color: var(--red); border-width: 1px 1px 1px 3px; }
  .thread-msg small { display: block; color: var(--faint); font-size: 12.5px; margin-bottom: 4px; }
  .done-box { text-align: center; padding: 70px 10px; animation: up .3s ease both; }
  .done-box .ok { width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%; background: var(--green-soft); color: var(--green-ink); display: grid; place-items: center; }
</style>
</head>
<body>

<div class="story"><div class="story-in">
  <span class="story-h">Flow</span>
  <nav class="stepbar" id="stepbar" aria-label="Steps"></nav>
  <div class="navs"><button class="nb" id="prev" aria-label="Previous step">←</button><button class="nb" id="nextb" aria-label="Next step">→</button></div>
</div></div>

<div class="stage">
  <div class="win">
    <div class="chrome"><i></i><i></i><i></i><span class="url" id="url">growjin.com</span></div>
    <div class="body" id="body"></div>
  </div>
  <aside class="behind" id="behind" aria-live="polite"></aside>
</div>

<script>
/* ---------- icons ---------- */
const P = {
  ask: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  tools: '<path d="M4 7h16M4 12h16M4 17h10"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  gsc: '<path d="M4 19h16"/><path d="M7 15l4-4 3 2 5-6"/>',
  ga: '<path d="M6 19V11M12 19V5M18 19v-6"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  ig: '<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
};
const ic = (k, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;

/* ---------- the questions on the Ask page (made-up Frekto data) ---------- */
const Q = {
  email: {
    q: 'Who should I email today?', n: '5', nl: 'emails ready for your OK', ch: 'Found by this morning’s search',
    short: '<b>5 small businesses</b> look like your best customers. Start with <b>Bloom Salon</b>: they post on Instagram but stopped 3 months ago.',
    figH: ['Ready for your OK', 'Lead Finder · 04:00 today'],
    fig: () => `<div class="list">${[['Bloom Salon', 'Hair salon, Leeds · last post 94 days ago'], ['Paper & Wick', 'Candle shop on Etsy · posts once a month'], ['Kofi Corner', 'Café, Bristol · no posts since June'], ['Tidy Paws', 'Dog groomer · Facebook only'], ['Loom Studio', 'Weaving classes · Instagram, 3 posts']].map(([a, b]) => `<div class="li"><b>${a}</b><span>${b}</span></div>`).join('')}</div>`,
    next: ['Review Bloom Salon’s email', 'Written and ready. Approve, change or skip.', 'Review the email'], go: 'lead',
    then: [['Paper & Wick, Kofi Corner and 2 more', 'Open next, one after another'], ['Find more leads', 'Runs again tomorrow at 04:00']],
    src: 'Lead Finder search · emails checked with Hunter',
  },
  google: {
    q: 'Why am I not on Google?', n: '38', nl: 'of 412 pages on Google', ch: 'Same as last week',
    short: 'Google knows <b>412 of your pages</b> but kept only <b>38</b>. It’s busy with 300 thin post pages, so your blog posts are still waiting.',
    figH: ['Where your pages are stuck', 'Last 28 days'],
    fig: () => funnel(),
    next: ['Hide the 300 post pages from Google', 'They get 0 visits. We wrote the fix for whoever runs your site.', 'Get the fix'], go: 'fix',
    then: [['Ask Google to read your 5 best posts', 'Up to 10 a day in Search Console'], ['Link to your blog from the homepage', '14 posts have no page linking to them']],
    src: 'Search Console · sitemap.xml read today',
  },
  post: {
    q: 'What should I post this week?', n: '3', nl: 'posts drafted', ch: 'From what your buyers search',
    short: 'Three posts are drafted from what small shops ask about this week. <b>“5 posts a café can make in 10 minutes”</b> fits best.',
    figH: ['Drafted for you', 'Instagram · this week'],
    fig: () => `<div class="posts">${[['5 posts a café can make in 10 minutes', 'var(--green-soft)', 'Mon'], ['Before / after: one photo, three posts', 'var(--soft)', 'Wed'], ['What to post when you have nothing new', 'var(--pick)', 'Fri']].map(([t, c, d]) => `<div class="post"><div class="img" style="background:${c}">${t}</div><div class="cap">${d} · ready</div></div>`).join('')}</div>`,
    next: ['Check Monday’s post', 'Caption and picture are ready. Change anything, then schedule.', 'Open the post'], go: 'tool:Social Studio',
    then: [['Wednesday and Friday', 'Open after Monday’s'], ['Turn the best one into a blog post', 'It also answers a search with 480 a month']],
    src: 'Search Agent topics · Social Studio drafts',
  },
  talk: {

function funnel() {
  const rows = [['Google knows', 412, 'var(--bar)'], ['Google read', 160, 'var(--bar)'], ['Kept on Google', 38, 'var(--bar2)'], ['Clicked', 9, 'var(--green)']];
  const W = 600; let y = 0, o = '';
  rows.forEach(([l, v, c]) => { const w = Math.max(6, v / 412 * (W - 170)); o += `<text x="0" y="${y + 18}" font-size="13" fill="var(--dim)">${l}</text><rect x="120" y="${y + 4}" width="${w}" height="20" rx="5" fill="${c}"/><text x="${128 + w}" y="${y + 19}" font-size="13.5" font-weight="600" fill="var(--text)">${v}</text>`; y += 36; });
  return `<svg viewBox="0 0 ${W} ${y}" role="img" aria-label="412 known, 160 read, 38 kept, 9 clicked">${o}</svg>`;
}
function bars7() {
  const v = [41, 55, 48, 62, 70, 66, 70], W = 600, H = 130, bw = 56;
  let o = '';
  v.forEach((n, i) => { const h = n / 70 * (H - 30); const x = i * (W / 7) + 12; o += `<rect x="${x}" y="${H - 20 - h}" width="${bw}" height="${h}" rx="5" fill="${i === 6 ? 'var(--green)' : 'var(--bar)'}"/><text x="${x + bw / 2}" y="${H - 4}" font-size="11.5" text-anchor="middle" fill="var(--faint)">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visits per day last week">${o}</svg>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const st = t.closest('[data-step]'); if (st) { e.preventDefault(); if (+st.dataset.step === 3 || +st.dataset.step === 7) leadI = 0; return go(+st.dataset.step); }
  if (t.closest('[data-next]')) { e.preventDefault(); return go(cur + 1); }
  const c = t.closest('[data-conn]'); if (c) { conn[c.dataset.conn] = true; return render(); }
  const q = t.closest('[data-q]'); if (q) { pickQ = q.dataset.q; clear(); cur = 4; seen.add(4); return render(); }
  if (t.closest('[data-approve]')) { leadI++; return render(); }
  if (t.closest('[data-back-answer]')) return render();
  if (t.closest('[data-done-fix]')) { document.getElementById('body').innerHTML = shell(`<div class="col"><div class="done-box"><div class="ok">${ic('check', 22)}</div><h1>Brief copied</h1><p class="sub">Tomorrow morning we check the pages are hidden. The card’s number will change once Google re-reads them.</p><div style="margin-top:22px"><button class="btn go" data-step="3">Back to Ask</button></div></div></div>`, 'Search Agent'); return; }
  const g = t.closest('[data-go]'); if (g) {
    const v = g.dataset.go;
    if (v === 'lead') { leadI = 0; return go(5); }
    const b = document.getElementById('body');
    b.innerHTML = v === 'fix' ? fixScreen() : v === 'reply' ? replyScreen() : toolScreen(v.slice(5));
    b.querySelector('.main').scrollTop = 0;
  }
});
