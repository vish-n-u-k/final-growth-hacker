<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Competitor Leads Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff; --bg-soft: #eef1ee; --card: #ffffff; --line: #dfe4df;
    --text: #16201a; --text-dim: #4c5a50; --text-faint: #6f7c72;
    --green: #15803d; --accent: #e3f3e8; --accent-fg: #0f5a2b;
    --warn: #b45309; --warn-soft: #fdf0dc; --crit: #b42318; --crit-soft: #fde8e6;
    --star: #e2a400;
    --display: 'Fraunces', Georgia, serif; --body: 'Outfit', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ece9; color: var(--text); font-family: var(--body); }
  button { font-family: inherit; }

  /* mockup controls */
  .ctl { position: sticky; top: 0; z-index: 50; background: #1d2620; color: #e8f0ea; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  .ctl h1 { font: 600 15px var(--body); margin: 0 12px 0 0; }
  .ctl .grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .ctl .lbl { font-size: 12px; color: #9fb0a5; margin-right: 4px; }
  .ctl button { font: 500 13px var(--body); border: 1px solid #3a4a40; background: transparent; color: #e8f0ea; padding: 6px 11px; border-radius: 8px; cursor: pointer; }
  .ctl button[aria-pressed="true"] { background: #e8f0ea; color: #16201a; border-color: #e8f0ea; }
  .note { max-width: 1180px; margin: 14px auto 0; padding: 0 20px; font-size: 13.5px; color: #3c4a41; line-height: 1.5; }
  .note b { color: #16201a; }

  /* app frame */
  .frame { max-width: 1180px; margin: 14px auto 40px; background: var(--bg); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.08); display: flex; min-height: 820px; }
  .frame.phone { max-width: 390px; }
  .side { width: 200px; flex: none; background: var(--bg-soft); border-right: 1px solid var(--line); padding: 16px 12px; font-size: 13px; }
  .frame.phone .side { display: none; }
  .side .logo { font: 600 15px var(--display); display: flex; gap: 8px; align-items: center; margin: 0 6px 18px; }
  .side .logo i { width: 20px; height: 20px; border-radius: 6px; background: var(--green); display: inline-block; }
  .side .g { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); margin: 16px 8px 6px; }
  .side a { display: block; padding: 6px 8px; border-radius: 7px; color: var(--text-dim); }
  .side a.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .main { flex: 1; min-width: 0; padding: 0 32px 40px; }
  .frame.phone .main { padding: 0 16px 32px; }
  .col { max-width: 880px; }

  /* compact header (Option A) */
  .hd { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.94); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding: 14px 0; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .hd-l, .hd-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hd-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); }
  .hd h1 { font: 600 20px/1.2 var(--display); margin: 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--bg-soft); color: var(--text-dim); white-space: nowrap; }
  .chip.ok { background: var(--accent); color: var(--accent-fg); }
  .chip.ok::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .q { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--text-dim); font: 700 12px var(--body); }
  .link { font-size: 13px; font-weight: 600; color: var(--accent-fg); text-decoration: none; white-space: nowrap; }

  .btn { height: 36px; padding: 0 16px; border-radius: 9px; font: 600 13px var(--body); border: 1px solid var(--line); background: #fff; color: var(--text-dim); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.pri { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.sm { height: 30px; padding: 0 12px; font-size: 12.5px; border-radius: 8px; }
  .btn.ghost { border-color: transparent; background: none; }
  .btn:disabled { opacity: .55; cursor: default; }

  /* ── empty state ── */
  .empty { text-align: center; padding: 34px 20px 28px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(180deg, #f3f8f4, #fff 55%); }
  .art { width: 132px; height: 72px; margin: 0 auto 14px; position: relative; }
  .art .rv { position: absolute; left: 0; top: 10px; width: 70px; height: 52px; border-radius: 10px; background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 12px rgba(0,0,0,.06); padding: 8px; text-align: left; }
  .art .rv .st { color: var(--star); font-size: 11px; letter-spacing: 1px; }
  .art .rv .st s { color: #d9ddd9; text-decoration: none; }
  .art .rv i { display: block; height: 5px; border-radius: 3px; background: var(--bg-soft); margin-top: 5px; }
  .art .ar { position: absolute; left: 76px; top: 30px; color: var(--green); font-weight: 700; }
  .art .env { position: absolute; right: 0; top: 14px; width: 42px; height: 42px; border-radius: 12px; background: var(--green); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(21,128,61,.3); }
  .empty h2 { font: 600 22px/1.3 var(--display); margin: 0 0 8px; }
  .empty > p { margin: 0 auto 20px; max-width: 520px; font-size: 14px; color: var(--text-dim); line-height: 1.55; }
  .form { max-width: 600px; margin: 0 auto; text-align: left; }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--bg-soft); margin-bottom: 10px; }
  .seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-dim); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .inrow { display: flex; gap: 8px; }
  .frame.phone .inrow { flex-direction: column; }
  .frame.phone .inrow .in { flex: none; }
  .in { flex: 1; height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; font: 400 14px var(--body); background: #fff; color: var(--text); min-width: 0; }
  .in:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(21,128,61,.12); }
  .inrow .btn { height: 42px; padding: 0 20px; font-size: 14px; }
  .try { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--text-faint); }
  .try button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 4px 10px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; }
  .try button:hover { border-color: var(--green); color: var(--text); }
  .fine { margin-top: 18px; display: flex; justify-content: center; gap: 6px 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-faint); }
  .fine span::before { content: '✓ '; color: var(--green); font-weight: 700; }

  /* ── scan bar (what's being scanned) ── */
  .scanbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; font-size: 13.5px; }
  .scanbar b { font-weight: 600; }
  .scanbar .grow { flex: 1; }

  /* ── steps, one by one ── */
  .steps { border: 1px solid var(--line); border-radius: 14px; padding: 6px 16px; margin-bottom: 16px; }
  .step { display: flex; gap: 12px; padding: 11px 0; position: relative; }
  .step + .step { border-top: 1px solid var(--line); }
  .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--text-faint); margin-top: 1px; }
  .step.run .dot { border-color: var(--green); border-top-color: transparent; animation: spin .8s linear infinite; }
  .step.done .dot { background: var(--green); border-color: var(--green); color: #fff; }
  .step.bad .dot { background: var(--crit); border-color: var(--crit); color: #fff; }
  .step.skip .dot { border-style: dashed; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .step .t { font-size: 14px; font-weight: 600; }
  .step.wait .t, .step.skip .t { color: var(--text-faint); font-weight: 500; }
  .step .d { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .step.bad .d { color: var(--crit); }
  .bar { height: 4px; border-radius: 99px; background: var(--bg-soft); margin-top: 7px; max-width: 260px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .3s; }
  .summary { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 11px 14px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-size: 13.5px; margin-bottom: 16px; }
  .summary b { font-weight: 700; }
  .summary .grow { flex: 1; }
  .summary button { border: 0; background: none; color: var(--accent-fg); font: 600 13px var(--body); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* ── results ── */
  .rhd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 10px; }
  .rhd h2 { font-size: 15px; margin: 0; }
  .filters { display: flex; gap: 4px; margin-left: auto; }
  .filters button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 4px 10px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; }
  .filters button[aria-pressed="true"] { border-color: var(--green); color: var(--accent-fg); background: var(--accent); font-weight: 600; }
  .lead { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; animation: in .35s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .lead-top { display: flex; gap: 12px; align-items: flex-start; }
  .av { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--bg-soft); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--text-dim); }
  .lead-main { flex: 1; min-width: 0; }
  .lead-name { font-size: 14.5px; font-weight: 600; }
  .lead-name .co { font-weight: 400; color: var(--text-dim); }
  .lead-sub { font-size: 12.5px; color: var(--text-faint); margin-top: 1px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stars { color: var(--star); letter-spacing: 1px; }
  .stars s { color: #d9ddd9; text-decoration: none; }
  .fit { flex: none; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); white-space: nowrap; }
  .why { font-size: 13.5px; margin: 10px 0 6px; line-height: 1.5; }
  .pains { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pains span { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--bg-soft); color: var(--text-dim); }
  .quote { font-size: 13px; color: var(--text-dim); line-height: 1.5; border-left: 3px solid var(--line); padding: 2px 0 2px 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lead-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .contact { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; flex: 1; min-width: 200px; }
  .contact .v { font-size: 11px; font-weight: 700; color: var(--accent-fg); background: var(--accent); padding: 1px 7px; border-radius: 99px; }
  .contact .u { font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 1px 7px; border-radius: 99px; }
  .contact.looking { color: var(--text-faint); }
  .mini { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--green); animation: spin .8s linear infinite; display: inline-block; }
  .editor { margin-top: 12px; padding: 14px; border-radius: 12px; background: var(--bg-soft); display: grid; gap: 10px; }
  .editor label { font-size: 12px; font-weight: 600; color: var(--text-dim); display: grid; gap: 4px; }
  .editor input, .editor textarea { font: 400 13.5px/1.5 var(--body); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: #fff; color: var(--text); }
  .editor textarea { min-height: 120px; resize: vertical; }
  .editor .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .editor .hint { font-size: 12px; color: var(--text-faint); }
  .more { font-size: 13px; color: var(--text-faint); margin-top: 6px; }
  .more button { border: 0; background: none; color: var(--accent-fg); font: 600 13px var(--body); cursor: pointer; padding: 0; }

  /* problem / nothing states */
  .prob { border: 1px solid #f3c7c2; background: #fff8f7; border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  .prob h3 { margin: 0 0 4px; font-size: 15px; color: var(--crit); }
  .prob p { margin: 0 0 12px; font-size: 13.5px; color: var(--text-dim); line-height: 1.5; }
  .prob .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .none { text-align: center; border: 1px dashed var(--line); border-radius: 14px; padding: 26px 18px; }
  .none h3 { margin: 0 0 6px; font-size: 16px; }
  .none p { margin: 0 auto 14px; max-width: 460px; font-size: 13.5px; color: var(--text-dim); line-height: 1.5; }
</style>
</head>
<body>

<div class="ctl" role="toolbar" aria-label="Mockup controls">
  <h1>Competitor Leads — flow</h1>
  <div class="grp"><span class="lbl">State</span>
    <button data-s="empty">1 · Empty</button>
    <button data-s="run">2 · Running (plays)</button>
    <button data-s="done">3 · Done</button>
    <button data-s="blocked">Problem: blocked</button>
    <button data-s="nothing">Problem: nothing found</button>
  </div>
  <div class="grp"><span class="lbl">Width</span>
    <button data-w="desk">Desktop</button>
    <button data-w="phone">Phone</button>
  </div>
</div>
<p class="note" id="note"></p>

<div class="frame" id="frame">
  <nav class="side" aria-label="Sidebar (mock)">
    <div class="logo"><i></i>GrowJin</div>
    <a>Today</a><a>Growth Path</a>
    <div class="g">Get customers</div><a>Lead Agent</a><a class="on">Competitor Leads</a><a>Email Outreach</a>
    <div class="g">Get seen</div><a>Search Agent</a><a>Social Studio</a><a>Meta Ads</a>
    <div class="g">Keep track</div><a>Reminders</a><a>Analytics</a>
  </nav>
  <main class="main"><div class="col" id="app"></div></main>
</div>

<script>
const NOTES = {
  empty: '<b>Empty state</b> (no scan yet): one clear sentence, the form, and your own competitors as one-click chips. Click a chip, then <b>Find leads</b> to watch it run.',
  run: '<b>Running:</b> each step shows what it is doing and what it found, <b>one at a time</b>. Leads appear the moment they are scored, then get their email and draft as those steps finish, so there is something to look at within seconds.',
  done: '<b>Done:</b> the steps fold into one green summary (with time and cost). Leads are filtered by “Ready to email / Needs a contact”. <b>Review email</b> opens the draft in place.',
  blocked: '<b>A step fails:</b> it says which step, why, in plain words, and what to do, instead of silently showing “0 reviews” (what happens today when Trustpilot blocks us).',
  nothing: '<b>Nothing found:</b> the scan worked but no reviewer was a good fit. Says so, and suggests the next thing to try.',
}

const LEADS = [
  { n: 'Maya Chen', co: 'Bloom & Twig Florist', stars: 2, date: 'Oct 14', fit: 9, why: 'Designs every post in Canva, then schedules in Buffer. Frekto would do both for her in a minute.', pains: ['Slow to design posts', 'Posts failing to publish'], quote: 'Buffer keeps failing to publish my Instagram posts and I still have to design everything myself in Canva. I’m losing five hours a week on social media.', email: 'maya@bloomandtwig.co', verified: true },
  { n: 'Daniel Ortiz', co: 'Ortiz Coaching', stars: 1, date: 'Oct 9', fit: 8, why: 'Wants captions written for him; found Buffer’s AI assistant generic.', pains: ['Generic AI captions'], quote: 'The AI assistant writes the same bland captions for everything. I wanted something that actually sounds like my brand.', email: 'daniel@ortizcoaching.com', verified: false },
  { n: 'Priya Nair', co: 'Nair Bakes', stars: 3, date: 'Oct 3', fit: 8, why: 'Small bakery posting daily by hand; asked for “something that just makes the post”.', pains: ['No time to post daily'], quote: 'Fine for scheduling but I still need to make every single post. I just want something that makes the post for me.', email: null },
  { n: 'Tom Becker', co: 'Becker Fitness', stars: 2, date: 'Sep 28', fit: 7, why: 'Runs three locations and struggles to keep posts on-brand across them.', pains: ['Inconsistent branding'], quote: 'Hard to keep posts consistent across our three studios. Every location does its own thing.', email: 'tom@beckerfit.de', verified: true },
  { n: 'Lena Fischer', co: 'Studio Lena', stars: 1, date: 'Sep 22', fit: 7, why: 'Left Buffer over price; looking for one tool for writing and scheduling.', pains: ['Price', 'Too many tools'], quote: 'Paying for Buffer plus Canva plus ChatGPT is too much for a one-person studio.', email: null },
]

const STEPS = [
  { t: 'Reading reviews', d: 'Trustpilot reviews of buffer.com from the last 3 months', done: '60 reviews read' },
  { t: 'Picking unhappy customers', d: 'Keeping 1–3 star reviews', done: '17 unhappy reviewers' },
  { t: 'Scoring how well Frekto fits each one', d: '', done: '5 good fits (7+ out of 10) · 12 didn’t fit' },
  { t: 'Finding contact emails', d: 'Checking their websites', done: '3 of 5 found' },
  { t: 'Drafting a personal email to each', d: '', done: '3 emails ready to review' },
]

let state = 'empty', w = 'desk', platform = 'trustpilot', comp = '', filter = 'all', openEditor = null, showSteps = false
let run = null // live run: { step, progress, leads: [{...lead, stage}] }
let timers = []

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const stars = n => `<span class="stars" aria-label="${n} out of 5 stars">${'★'.repeat(n)}<s>${'★'.repeat(5 - n)}</s></span>`
const initials = n => n.split(' ').map(x => x[0]).join('').slice(0, 2)

function header() {
  return `<header class="hd">
    <div class="hd-l">
      <span class="hd-ic"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.4"/></svg></span>
      <h1>Competitor Leads</h1><span class="chip">Beta</span>
      <button class="q" aria-label="What this does">?</button>
    </div>
    <div class="hd-r"><span class="chip ok">Gmail connected</span><a class="link" href="#">Email Outreach →</a></div>
  </header>`
}

function emptyView() {
  const ph = platform === 'trustpilot' ? 'competitor.com or their Trustpilot link' : 'apps.shopify.com/competitor-app'
  return `<section class="empty">
    <div class="art" aria-hidden="true">
      <div class="rv"><div class="st">★★<s>★★★</s></div><i></i><i style="width:70%"></i></div>
      <div class="ar">→</div>
      <div class="env"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="4.5" width="15" height="11" rx="2"/><path d="M3.5 6l6.5 5 6.5-5"/></svg></div>
    </div>
    <h2>Turn your competitors’ unhappy customers into leads</h2>
    <p>Paste a competitor’s review page. GrowJin reads the 1–3 star reviews, picks the people Frekto would actually help, and drafts an email to each one.</p>
    <div class="form">
      <div class="seg" role="group" aria-label="Where their reviews are">
        <button data-p="trustpilot" aria-pressed="${platform === 'trustpilot'}">Trustpilot</button>
        <button data-p="shopify" aria-pressed="${platform === 'shopify'}">Shopify App Store</button>
      </div>
      <div class="inrow">
        <input class="in" id="comp" value="${esc(comp)}" placeholder="${ph}" aria-label="Competitor" />
        <button class="btn pri" id="go">Find leads</button>
      </div>
      <div class="try">Your competitors:
        <button data-c="buffer.com">buffer.com</button><button data-c="predis.ai">predis.ai</button><button data-c="later.com">later.com</button>
      </div>
    </div>
    <div class="fine"><span>Takes about a minute</span><span>Costs about 2¢</span><span>Nothing is sent until you approve it</span></div>
  </section>`
}

function scanBar(label) {
  return `<div class="scanbar"><span>${platform === 'trustpilot' ? 'Trustpilot' : 'Shopify App Store'} · <b>${esc(comp || 'buffer.com')}</b></span><span class="grow"></span>${label}</div>`
}

function stepsView(r) {
  return `<div class="steps" aria-live="polite">${STEPS.map((s, i) => {
    const cls = i < r.step ? 'done' : i === r.step ? (r.failed ? 'bad' : 'run') : 'wait'
    let d = i < r.step ? s.done : i === r.step ? (r.failed ? r.failed : (r.detail ?? s.d)) : ''
    const bar = i === r.step && !r.failed && r.progress != null ? `<div class="bar"><i style="width:${r.progress}%"></i></div>` : ''
    const dot = cls === 'done' ? '✓' : cls === 'bad' ? '!' : cls === 'wait' ? i + 1 : ''
    return `<div class="step ${r.failed && i > r.step ? 'skip' : cls}"><span class="dot">${dot}</span><div><div class="t">${s.t}</div>${d ? `<div class="d">${d}</div>` : ''}${bar}</div></div>`
  }).join('')}</div>`
}

function leadCard(l, i, stage) {
  // stage: 'scored' → 'contact' (looking) → 'contacted' → 'drafted'
  const contact = stage === 'scored' ? `<span class="contact looking">Waiting to look for an email…</span>`
    : stage === 'contact' ? `<span class="contact looking"><span class="mini"></span>Looking for an email on their website…</span>`
    : l.email ? `<span class="contact">✉ ${l.email} ${l.verified ? '<span class="v">Verified</span>' : '<span class="u">From their website</span>'}</span>`
    : `<span class="contact">No email found · <a class="link" href="#">open their website ↗</a></span>`
  const act = stage !== 'drafted' ? '' : l.email
    ? `<button class="btn pri sm" data-ed="${i}">${openEditor === i ? 'Close' : 'Review email'}</button><button class="btn sm ghost">Skip</button>`
    : `<button class="btn sm">Add email</button><button class="btn sm ghost">Skip</button>`
  const editor = openEditor === i && l.email ? `<div class="editor">
      <label>To<input value="${l.email}" /></label>
      <label>Subject<input value="Posting without the 5 hours a week" /></label>
      <label>Message<textarea>Hi ${l.n.split(' ')[0]},

I saw your note about spending five hours a week designing posts in Canva and then scheduling them. Frekto does both: it reads your website, makes on-brand posts and schedules them, usually in under a minute.

Would it help if I set up a week of posts for ${l.co} so you can see if it fits? No cost.

Frekto</textarea></label>
      <div class="acts"><button class="btn pri">Send from Gmail</button><button class="btn">Copy</button><span class="hint">One follow-up in 5 days unless they reply.</span></div>
    </div>` : ''
  return `<article class="lead">
    <div class="lead-top">
      <span class="av" aria-hidden="true">${initials(l.n)}</span>
      <div class="lead-main"><div class="lead-name">${l.n} <span class="co">· ${l.co}</span></div>
        <div class="lead-sub">${stars(l.stars)}<span>${l.date}</span><a class="link" href="#">Read review ↗</a></div></div>
      <span class="fit">Fit ${l.fit}/10</span>
    </div>
    <div class="why">${l.why}</div>
    <div class="pains">${l.pains.map(p => `<span>${p}</span>`).join('')}</div>
    <div class="quote">“${l.quote}”</div>
    <div class="lead-foot">${contact}${act}</div>
    ${editor}
  </article>`
}

function resultsView(list, live) {
  const withEmail = list.filter(x => x.l.email && x.stage === 'drafted').length
  const needs = list.filter(x => !x.l.email && x.stage === 'drafted').length
  const shown = live ? list : list.filter(x => filter === 'all' || (filter === 'ready' ? x.l.email : !x.l.email))
  return `<div class="rhd"><h2>${live ? `Good fits so far (${list.length})` : `Good fits (${list.length})`}</h2>
    ${live ? '' : `<div class="filters" role="group" aria-label="Filter">
      <button data-f="all" aria-pressed="${filter === 'all'}">All ${list.length}</button>
      <button data-f="ready" aria-pressed="${filter === 'ready'}">Ready to email ${withEmail}</button>
      <button data-f="needs" aria-pressed="${filter === 'needs'}">Needs a contact ${needs}</button></div>`}</div>
    ${shown.map(x => leadCard(x.l, LEADS.indexOf(x.l), x.stage)).join('')}
    ${live ? '' : '<p class="more">12 other reviewers didn’t fit Frekto · <button>show them</button></p>'}`
}

function render() {
  const app = document.getElementById('app')
  let html = header()
  if (state === 'empty') html += emptyView()
  else if (state === 'run' && run) {
    html += scanBar('<button class="btn sm" id="cancel">Stop</button>') + stepsView(run)
    if (run.leads.length) html += resultsView(run.leads, true)
  } else if (state === 'done') {
    html += scanBar('<button class="btn sm" id="new">New scan</button>')
    html += `<div class="summary"><span>✓ <b>Done in 52s</b> · 5 good fits · 3 ready to email · 2 need a contact · cost 2¢</span><span class="grow"></span><button id="toggle">${showSteps ? 'Hide steps' : 'Show steps'}</button></div>`
    if (showSteps) html += stepsView({ step: 5 })
    html += resultsView(LEADS.map(l => ({ l, stage: 'drafted' })), false)
  } else if (state === 'blocked') {
    html += scanBar('<button class="btn sm" id="new">New scan</button>')
    html += stepsView({ step: 0, failed: 'Trustpilot blocked the request, so no reviews could be read.' })
    html += `<div class="prob"><h3>We couldn’t read buffer.com’s Trustpilot reviews</h3>
      <p>Trustpilot sometimes blocks automatic reading. Nothing was charged. Try again in a few minutes; if it keeps happening, scan the competitor’s Shopify App Store page instead.</p>
      <div class="acts"><button class="btn pri">Try again</button><button class="btn">Use Shopify App Store</button></div></div>`
  } else if (state === 'nothing') {
    html += scanBar('<button class="btn sm" id="new">New scan</button>')
    html += `<div class="summary"><span>✓ <b>Done in 31s</b> · 60 reviews read · 17 unhappy · 0 good fits</span><span class="grow"></span></div>`
    html += `<div class="none"><h3>No good fits this time</h3><p>buffer.com’s unhappy reviewers mostly complained about billing and team permissions, which Frekto doesn’t solve. Try another competitor, or a competitor closer to what Frekto does.</p>
      <button class="btn pri" id="new2">Scan another competitor</button></div>`
  }
  app.innerHTML = html
  document.getElementById('note').innerHTML = NOTES[state]
  document.getElementById('frame').classList.toggle('phone', w === 'phone')
  document.querySelectorAll('[data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === state))
  document.querySelectorAll('[data-w]').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === w))
  bind()
}

function bind() {
  const $ = id => document.getElementById(id)
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { platform = b.dataset.p; render() })
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { comp = b.dataset.c; render(); $('comp').focus() })
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; render() })
  document.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { const i = +b.dataset.ed; openEditor = openEditor === i ? null : i; render() })
  if ($('comp')) $('comp').oninput = e => { comp = e.target.value }
  if ($('go')) $('go').onclick = () => { if (!comp) comp = 'buffer.com'; startRun() }
  if ($('cancel')) $('cancel').onclick = () => { stop(); state = 'empty'; render() }
  if ($('toggle')) $('toggle').onclick = () => { showSteps = !showSteps; render() }
  ;['new', 'new2'].forEach(id => { if ($(id)) $(id).onclick = () => { stop(); state = 'empty'; comp = ''; render() } })
}

function stop() { timers.forEach(clearTimeout); timers = [] }
const at = (ms, fn) => timers.push(setTimeout(() => { fn(); render() }, ms))

function startRun() {
  stop()
  state = 'run'; openEditor = null; filter = 'all'
  run = { step: 0, progress: null, detail: null, leads: [] }
  render()
  let t = 0
  // 1. reading reviews (pages 1-3)
  ;[1, 2, 3].forEach(p => at(t += 700, () => { run.detail = `Reading page ${p} of 3 · ${p * 20} reviews so far`; run.progress = p * 33 }))
  // 2. unhappy
  at(t += 600, () => { run.step = 1; run.progress = null; run.detail = 'Keeping 1–3 star reviews' })
  // 3. scoring, leads appear as they're scored
  at(t += 700, () => { run.step = 2; run.progress = 0; run.detail = 'Scored 0 of 17' })
  let scored = 0
  for (let k = 1; k <= 17; k++) {
    at(t += 260, () => {
      scored = k; run.progress = Math.round(k / 17 * 100); run.detail = `Scored ${k} of 17 · ${run.leads.length} good fit${run.leads.length === 1 ? '' : 's'} so far`
      const hit = { 3: 0, 6: 1, 9: 2, 12: 3, 15: 4 }[k]
      if (hit !== undefined) { run.leads.push({ l: LEADS[hit], stage: 'scored' }); run.detail = `Scored ${k} of 17 · ${run.leads.length} good fit${run.leads.length === 1 ? '' : 's'} so far` }
    })
  }
  // 4. contacts, one lead at a time
  at(t += 500, () => { run.step = 3; run.progress = 0; run.detail = 'Checking their websites' })
  LEADS.forEach((l, i) => {
    at(t += 350, () => { run.leads[i].stage = 'contact' })
    at(t += 650, () => { run.leads[i].stage = 'contacted'; const found = run.leads.filter(x => x.stage !== 'scored' && x.stage !== 'contact' && x.l.email).length; run.progress = Math.round((i + 1) / 5 * 100); run.detail = `${found} found so far` })
  })
  // 5. drafting
  at(t += 500, () => { run.step = 4; run.progress = 0; run.detail = 'Writing one email at a time' })
  LEADS.forEach((l, i) => at(t += 450, () => { run.leads[i].stage = 'drafted'; run.progress = Math.round((i + 1) / 5 * 100) }))
  at(t += 700, () => { state = 'done'; showSteps = false; run = null })
}

document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  stop(); openEditor = null; filter = 'all'
  if (b.dataset.s === 'run') { comp = comp || 'buffer.com'; startRun(); return }
  state = b.dataset.s; if (state !== 'empty' && !comp) comp = 'buffer.com'
  if (state === 'done') openEditor = 0
  render()
})
document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { w = b.dataset.w; render() })
render()
</script>
</body>
</html>
