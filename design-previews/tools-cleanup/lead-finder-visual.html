<title>Lead Finder in GrowJin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: sources as a row of coins (All, Maps, each competitor, Reddit, HN, your list) → a panel for the picked source → one board: to do → contacted → replied. Details in a side drawer. */
/* Tokens follow GrowJin (web/app/globals.css): light is the app default, dark matches its dark theme. --accent = --green, --hot = --crit. */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#eef1ee; --ink:#16201a; --dim:#4c5a50; --faint:#7d8a80; --line:#dfe4df;
  --accent:#15803d; --accent-ink:#ffffff; --accent-soft:#e3f3e8; --accent-text:#0f5a2b;
  --hot:#b42318; --hot-soft:#fde8e6; --star:#c98a0b; --ok:#15803d;
  --av-s:30%; --av-l:90%;
  --shadow:0 1px 2px rgba(22,32,26,.04);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Outfit",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#161e19; --sunk:#131b16; --ink:#e8f0ea; --dim:#a9b8ad; --faint:#74857a; --line:#27342c;
  --accent:#2fbf71; --accent-ink:#06140c; --accent-soft:#16301f; --accent-text:#86efac;
  --hot:#f87b70; --hot-soft:#361a17; --star:#f5b351; --ok:#4ade80;
  --av-s:16%; --av-l:24%; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#161e19; --sunk:#131b16; --ink:#e8f0ea; --dim:#a9b8ad; --faint:#74857a; --line:#27342c;
  --accent:#2fbf71; --accent-ink:#06140c; --accent-soft:#16301f; --accent-text:#86efac;
  --hot:#f87b70; --hot-soft:#361a17; --star:#f5b351; --ok:#4ade80;
  --av-s:16%; --av-l:24%; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
/* app shell, as in components/AppSidebar.tsx */
.app{display:flex;min-height:100vh}
.sb{width:232px;flex:none;background:var(--sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;font-family:var(--display);font-weight:700;font-size:15px}
.sb-brand svg{border-radius:6px}
.sb-group{margin-bottom:16px}
.sb-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 10px 8px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;color:var(--dim);font-size:13px;font-weight:500;text-align:left;margin-bottom:2px}
.nav:hover{background:var(--surface);color:var(--ink)}
.nav.active{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.nav svg{flex:none}
.rm-title{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:4px 10px 6px}
.rm-hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--dim);text-align:left}
.rm-hd:hover{background:var(--bg);color:var(--ink)}
.rm-hd .chev{color:var(--faint);transition:transform .15s}
.rm-hd[aria-expanded="true"] .chev{transform:rotate(90deg)}
.rm-hd .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-hd .ct{font-size:11.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.rm-hd .bar{flex-basis:100%;height:3px;border-radius:99px;background:var(--line);margin:3px 0 0 18px;width:calc(100% - 18px);overflow:hidden}
.rm-hd .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.rm-hd.locked{color:var(--faint)}
.rm-mods{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 17px;padding-left:8px;border-left:1px solid var(--line)}
.rm-mod{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:13px;color:var(--dim);text-align:left}
.rm-mod:hover{background:var(--bg);color:var(--ink)}
.rm-mod .d{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
.rm-mod .d.on{background:var(--accent);border-color:var(--accent)}
.rm-mod .p{margin-left:auto;font-size:11px;color:var(--faint)}
.sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:6px}
.sb-me{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:6px 8px;border-radius:8px;font-size:12.5px;font-weight:600}
.sb-me:hover{background:var(--surface)}
.sb-av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.themebtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.themebtn:hover{background:var(--surface);color:var(--ink)}
.mbar,.sb-close,.sb-scrim{display:none}
.main{flex:1;min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));padding-block:0 80px}
/* tool header, as in components/ToolHeader.tsx (.th-*) */
.th{padding:22px 0 18px}
.th-crumbs{display:flex;align-items:center;gap:6px;margin-bottom:30px;font-size:13px;color:var(--faint)}
.th-crumbs b{color:var(--dim);font-weight:500}
.th-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px 16px}
.th-title{margin:0;font-family:var(--display);font-size:32px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.th-sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:8px;font-size:14px;color:var(--dim)}
.th-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text)}
.th-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.th-chip.demo{background:var(--sunk);color:var(--dim)}
.th-chip.demo::before{background:var(--faint)}
.th-link{font-size:13px;font-weight:600;color:var(--accent-text)}
.th-link:hover{text-decoration:underline}
.th-actions{display:flex;align-items:center;gap:8px}
.gbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--dim);font-size:13px;font-weight:600}
.gbtn:hover{color:var(--ink)}
.about-steps{display:flex;flex-direction:column;gap:12px}
.about-step{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--line)}
.about-step .n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;flex:none}
.about-step b{display:block}
.about-step small{color:var(--dim);font-size:13px}
@media (max-width:760px){
  .app{flex-direction:column}
  .mbar{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 12px;padding-top:env(safe-area-inset-top,0px);background:var(--surface);border-bottom:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:16px}
  .mbar .l{display:flex;align-items:center;gap:8px}
  .mbar button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center}
  .sb{position:fixed;top:0;right:0;bottom:0;z-index:80;height:100%;width:min(84vw,300px);border-right:0;border-left:1px solid var(--line);transform:translateX(102%);visibility:hidden;transition:transform .25s,visibility 0s .25s;box-shadow:0 10px 40px rgba(0,0,0,.25);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .sb.open{transform:none;visibility:visible;transition:transform .25s}
  .sb-close{display:grid;place-items:center;margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--dim)}
  .sb-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:79;opacity:0;pointer-events:none;transition:opacity .2s}
  .sb-scrim.on{opacity:1;pointer-events:auto}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .th-crumbs{margin-bottom:16px}
  .th-title{font-size:28px}
}

.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--dim);background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn:hover{color:var(--ink)}
.meterTop{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--faint)}
.meterTop b{font-family:var(--display);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.meterTop .bar{width:60px;height:5px;border-radius:9px;background:var(--sunk);overflow:hidden}
.meterTop .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}

/* source coins */
.srcs{margin-top:20px;display:flex;flex-wrap:wrap;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.sep{flex:none;width:1px;background:var(--line);margin:8px 4px}
.coinbtn{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:14px;color:var(--dim);transition:background .2s,box-shadow .2s}
.coinbtn:hover{background:var(--surface)}
.coinbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.coinbtn[aria-pressed="true"] .t small{color:var(--accent-text)}
.coinbtn.off{opacity:.45}
.coin{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.coin .ring{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 17px,#000 18px);mask:radial-gradient(circle,transparent 17px,#000 18px)}
.coin .face{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--ink);font-size:13px}
.coin .face.all{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.coinbtn .t{text-align:left;line-height:1.25}
.coinbtn .t b{display:block;font-weight:600;white-space:nowrap}
.coinbtn .t small{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--faint);white-space:nowrap}
.coinbtn .nb{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--hot);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.coinbtn.lit .face{box-shadow:0 0 0 4px var(--accent-soft),0 0 0 6px var(--accent);transition:box-shadow .2s}
.addsrc{flex:none;width:56px;min-height:60px;border-radius:14px;border:1.5px dashed var(--line);color:var(--dim);display:grid;place-items:center}
.addsrc:hover{border-color:var(--accent);color:var(--accent)}

/* panel for the picked source */
.hero{margin-top:8px;background:var(--surface);border-radius:14px;border:1px solid var(--line);padding:20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;min-height:150px}
.hero .grow{flex:1;min-width:0}
.radar{position:relative;width:112px;height:112px;flex:none;border-radius:50%;
  background:radial-gradient(circle,var(--accent-soft) 0 22%,transparent 23% 44%,var(--accent-soft) 45% 46%,transparent 47% 70%,var(--accent-soft) 71% 72%,transparent 73%);border:1px solid var(--line)}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 300deg,color-mix(in srgb,var(--accent) 45%,transparent) 360deg);opacity:0}
.radar.on .sweep{opacity:1;animation:spin 1.1s linear infinite}
.radar .go{position:absolute;inset:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:transform .15s}
.radar .go:hover{transform:scale(1.06)}
.radar.on .go{pointer-events:none;opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}
.mix{display:flex;flex-direction:column;gap:8px}
.mixbar{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--sunk);gap:2px}
.mixbar i{display:block;height:100%;transition:width .5s}
.mixkey{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.mixkey span{display:flex;align-items:center;gap:6px}
.mixkey i{width:10px;height:10px;border-radius:3px}
.bigline{font-family:var(--display);font-size:24px;font-weight:500;margin:0}
.bigline b{font-weight:600;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column;gap:5px;flex:1.3;min-width:220px}
.hrow{display:grid;grid-template-columns:62px 1fr 34px;gap:10px;align-items:center;padding:3px 6px;border-radius:9px;text-align:left}
.hrow:hover:not(:disabled){background:var(--sunk)}
.hrow[aria-pressed="true"]{background:var(--hot-soft)}
.hrow:disabled{opacity:.55;cursor:default}
.hrow .s{display:flex;gap:1px;color:var(--star)}
.hrow .s .off{color:var(--line)}
.hrow .b{height:12px;border-radius:9px;background:var(--sunk);overflow:hidden}
.hrow .b i{display:block;height:100%;border-radius:9px;background:var(--line);transition:width .6s}
.hrow.bad .b i{background:var(--hot)}
.hrow .c{font-size:13px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.reading .b i,.reading .chip{animation:shimmer 1s ease-in-out infinite}
@keyframes shimmer{50%{opacity:.35}}
.bignum{display:flex;flex-direction:column;align-items:center;color:var(--faint);font-size:13px}
.bignum b{font-family:var(--display);font-weight:600;font-size:44px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.actbtn{display:flex;align-items:center;gap:10px;height:42px;padding:0 18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px}
.actbtn:hover{filter:brightness(1.08)}
.actbtn.on svg{animation:spin .9s linear infinite}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--faint);flex-wrap:wrap}
.plat{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--sunk);font-size:12px;color:var(--dim)}
.query{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.query .lab{font-size:13px;color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:99px;background:var(--sunk);font-size:14px;font-weight:500}
.chip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.chip button:hover{color:var(--ink);background:var(--bg)}
.chip.place{background:var(--surface);border:1px solid var(--line)}
.chipadd{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;border:1.5px dashed var(--line);color:var(--dim);font-size:14px}
.chipadd:hover{border-color:var(--accent);color:var(--accent)}
.chipin{border:1.5px solid var(--accent);border-radius:12px;padding:6px 10px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);width:150px}
.bigglyph{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:22px;color:var(--ink);flex:none}
.dropzone{flex:1;min-width:220px;display:flex;align-items:center;gap:14px;padding:18px;border-radius:14px;border:2px dashed var(--line);color:var(--dim);text-align:left}
.dropzone:hover{border-color:var(--accent);color:var(--ink);background:var(--sunk)}
.dropzone .bigglyph{background:var(--accent-soft);color:var(--accent-text)}
.dropzone b{display:block;color:var(--ink);font-size:16px}

/* board */
.board{margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lane{background:var(--sunk);border-radius:14px;padding:12px;min-height:200px;display:flex;flex-direction:column;gap:10px}
.lane-h{display:flex;align-items:center;gap:9px;padding:4px 6px 6px}
.lane-h .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface);color:var(--dim)}
.lane-h b{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.lane-h .n{margin-left:auto;font-family:var(--display);font-weight:600;font-size:20px;color:var(--faint);font-variant-numeric:tabular-nums}
.l-todo .lane-h .dot{background:var(--accent);color:var(--accent-ink)}
.l-replied .lane-h .dot{background:var(--hot);color:#fff}
.l-replied .lane-h .n{color:var(--hot)}
.filterpill{display:flex;align-items:center;gap:6px;align-self:flex-start;padding:4px 6px 4px 10px;border-radius:999px;background:var(--hot-soft);font-size:13px}
.filterpill button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.tile{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--surface);border-radius:12px;padding:11px 12px;border:1px solid var(--line);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-1px);border-color:var(--faint)}
.tile.sel{outline:2px solid var(--accent)}
.tile.new{animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.96)}}
.tile.replied{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot)}
.avw{position:relative;flex:none}
.av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--ink)}
.av.round{border-radius:50%}
.badge{position:absolute;right:-5px;bottom:-5px;min-width:19px;height:19px;padding:0 3px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:9px;color:var(--ink);border:2px solid var(--surface)}
.tile .t{min-width:0;flex:1}
.tile .name{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:13px;color:var(--faint);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.stars{display:inline-flex;gap:1px;color:var(--star)}
.stars .off{color:var(--line)}
.right{display:flex;align-items:center;gap:8px;flex:none}
.noemail{color:var(--faint)}
.fit{display:flex;gap:2px;align-items:flex-end;height:16px}
.fit i{width:3px;border-radius:2px;background:var(--line)}
.fit i:nth-child(1){height:6px}.fit i:nth-child(2){height:9px}.fit i:nth-child(3){height:12px}.fit i:nth-child(4){height:16px}
.fit i.on{background:var(--accent)}
.fu{display:flex;gap:4px}
.fu i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--faint)}
.fu i.on{background:var(--accent);border-color:var(--accent)}
.posted{color:var(--ok)}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 4px var(--hot-soft)}
.start{position:absolute;top:-9px;right:12px;background:var(--accent);color:var(--accent-ink);z-index:1;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--faint);font-size:13px;padding:20px 8px}
.empty svg{margin:0 auto 8px;opacity:.6}
.linkbtn{margin-top:auto;font-size:13px;color:var(--faint);padding:6px;border-radius:10px}
.linkbtn:hover{color:var(--ink)}
.legend{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;color:var(--faint);font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,13,24,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:21;transform:translateX(104%);transition:transform .28s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-20px 0 40px rgba(10,13,24,.18)}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:12px;padding:18px 20px 14px}
.d-head .av{width:48px;height:48px;font-size:18px}
.d-head h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;line-height:1.15}
.d-head .sub{color:var(--faint);font-size:13px;display:flex;align-items:center;gap:6px}
.d-head .x{margin-left:auto}
.d-body{flex:1;overflow:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:14px}
.d-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--dim)}
.btn.ghost:hover{color:var(--ink)}
.review{position:relative;padding:16px 16px 14px;border-radius:14px;background:var(--hot-soft)}
.review .q{position:absolute;top:6px;right:14px;font-family:var(--display);font-size:56px;line-height:1;color:var(--hot);opacity:.35}
.review h4{margin:6px 0 4px;font-size:15px}
.review p{margin:0;font-size:14px}
.review .foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--dim)}
.review .foot a{margin-left:auto;color:var(--dim);display:inline-flex;align-items:center;gap:4px}
.why{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--sunk);font-size:14px;color:var(--dim)}
.why svg{flex:none;margin-top:2px;color:var(--accent)}
.letter{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.to{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;font-size:13px;color:var(--faint);border-bottom:1px solid var(--line);min-height:46px}
.to b{color:var(--ink);font-weight:500}
.to input{flex:1;min-width:0;border:0;background:var(--sunk);border-radius:9px;padding:7px 10px;font:inherit;color:var(--ink)}
.to .look{padding:7px 12px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:flex;align-items:center;gap:6px}
.to .look.on svg{animation:spin .9s linear infinite}
.found{display:inline-flex;align-items:center;color:var(--ok);margin-left:auto;padding-right:6px}
.letter .subj,.letter textarea{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 14px;resize:none}
.letter .subj{font-weight:600;border-bottom:1px solid var(--line)}
.letter textarea{min-height:180px;line-height:1.55}
.draft{transition:opacity .2s}
.hint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint)}
.nofind{font-size:13px;color:var(--hot);display:flex;gap:6px;align-items:center;padding:8px 14px}
.timeline{display:flex;flex-direction:column;padding-left:4px}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;position:relative;padding-bottom:18px}
.step::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .p{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center}
.step.done .p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step .when{font-size:13px;color:var(--faint)}
.msg{padding:12px 14px;border-radius:16px;font-size:14px;max-width:92%}
.msg.them{background:var(--hot-soft);border-top-left-radius:4px}
.msg.us{background:var(--sunk);margin-left:auto;border-top-right-radius:4px}
.msg.post{background:var(--sunk);border-top-left-radius:4px}
.msg .who{font-size:12px;color:var(--faint);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.how{display:flex;gap:8px;flex-wrap:wrap}
.how span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--sunk);font-size:13px;color:var(--dim)}
.how b{color:var(--ink);font-weight:500}
.done-ill{display:grid;place-items:center;text-align:center;gap:10px;padding:40px 10px;color:var(--dim)}
.done-ill .ring{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-text)}
.done-ill h3{font-family:var(--display);font-weight:600;margin:0;font-size:24px;color:var(--ink)}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:14px;background:var(--sunk);color:var(--dim);font-weight:500;border:2px solid transparent;text-align:center}
.pick button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--surface)}
.pick .ic{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.stepper{display:flex;gap:6px}
.stepper i{flex:1;height:5px;border-radius:9px;background:var(--sunk)}
.stepper i.on{background:var(--accent)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.drop textarea{width:100%;min-height:150px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;resize:vertical}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--sunk);font-size:13px}
.person .av{width:24px;height:24px;border-radius:50%;font-size:11px}
.person.skip{opacity:.45;text-decoration:line-through}
.tok{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.carousel{display:flex;align-items:center;gap:8px}
.carousel .letter{flex:1;min-width:0}
.carousel .pv{padding:12px 14px;font-size:14px;white-space:pre-wrap}
.set{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--sunk)}
.set .ico{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--dim);font-weight:700;font-size:13px}
.set .t{flex:1;min-width:0}
.set .t small{display:block;color:var(--faint);font-size:12px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:21px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ok);font-weight:500}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.rm{color:var(--faint);width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.rm:hover{color:var(--hot);background:var(--surface)}
.grp{font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
input[type=range]{accent-color:var(--accent);width:100%}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:14px;z-index:30;transition:transform .25s;max-width:calc(100% - 32px)}
.toast:not(.on){pointer-events:none;visibility:hidden;transition:transform .25s,visibility 0s .25s}
.toast.on{transform:translate(-50%,0)}
.drawer.on ~ .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.toast button{color:var(--bg);font-weight:600;padding:6px 10px;border-radius:9px;background:color-mix(in srgb,var(--bg) 16%,transparent)}

@media (max-width:820px){

}

  .brand h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const S = (p, w=16, extra='') => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
const I = {
  check:w=>S('<path d="m5 12 5 5 9-10"/>',w||16),
  eye:S('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'),
  send:S('<path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/>'),
  reply:S('<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/>'),
  x:S('<path d="M6 6l12 12M18 6 6 18"/>',18),
  xs:S('<path d="M6 6l12 12M18 6 6 18"/>',12),
  spark:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3L20 10l-5.8 1.7L12 18l-2.2-6.3L4 10l5.8-1.7L12 2Z"/></svg>',
  plus:w=>S('<path d="M12 5v14M5 12h14"/>',w||16),
  out:w=>S('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',w||13),
  clock:S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',14),
  mail:S('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>'),
  at:S('<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/><path d="M3 3l18 18" stroke-width="2.6"/>',15),
  search:w=>S('<circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/>',w||14),
  refresh:S('<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',18,'stroke-width="2.4"'),
  stop:S('<rect x="6" y="6" width="12" height="12" rx="2"/>'),
  inbox:S('<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v6H3v-6l2.5-8Z"/>',34,'stroke-width="1.6"'),
  trash:S('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  pin:w=>S('<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/>',w||12,'stroke-width="2.4"'),
  copy:S('<rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15V6a3 3 0 0 1 3-3h9"/>'),
  file:w=>S('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M12 12v6M9 15l3-3 3 3"/>',w||16),
  list:w=>S('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',w||14),
  left:S('<path d="m15 6-6 6 6 6"/>',18),
  right:S('<path d="m9 6 6 6-6 6"/>',18),
  tp:w=>`<svg width="${w||14}" height="${w||14}" viewBox="0 0 24 24" fill="#00B67A"><path d="m12 2 3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>`,
  shop:w=>`<svg width="${w||14}" height="${w||14}" viewBox="0 0 24 24" fill="none" stroke="#5E8E3E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>`,
};
const star = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>`;
const stars = (n, s=13, cls='stars') => `<span class="${cls}" title="${n} star${n>1?'s':''}">${[1,2,3,4,5].map(i=>`<span class="${i<=n?'':'off'}">${star(s)}</span>`).join('')}</span>`;
const PLAT = {trustpilot:{name:'Trustpilot',ic:I.tp}, shopify:{name:'Shopify App Store',ic:I.shop}};
const hue = s => [...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const tint = h => `hsl(${h} var(--av-s) var(--av-l))`;
// Bar colours stay in the app palette: green = Google Maps, red shades = competitors, amber = forums
const mixColor = s => {
  if (s.type==='maps') return 'var(--accent)';
  if (s.type==='forum') return s.id==='reddit' ? 'var(--star)' : 'color-mix(in srgb, var(--star) 55%, transparent)';
  const i = sources.filter(x=>x.type==='rival').indexOf(s);
  return `color-mix(in srgb, var(--hot) ${[90,65,45,30][i%4]}%, transparent)`;
};
const avBg = s => tint(hue(s));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => n.replace(/&/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const firstOf = l => (l.person || l.name).split(' ')[0];

/* ---------- sources ---------- */
let sources = [
  {id:'maps', type:'maps', name:'Google Maps', glyph:'M', hue:145, on:true, last:'2 h ago', terms:['hair salons','cafés','gyms'], place:'Austin, TX'},
  {id:'predis', type:'rival', name:'Predis.ai', plat:'trustpilot', on:true, last:'2 days ago', hist:[38,11,9,22,64]},
  {id:'ocoya', type:'rival', name:'Ocoya', plat:'trustpilot', on:true, last:'5 days ago', hist:[21,9,6,14,40]},
  {id:'later', type:'rival', name:'Later', plat:'shopify', on:true, last:'1 week ago', hist:[17,6,8,30,120]},
  {id:'reddit', type:'forum', name:'Reddit', glyph:'r/', hue:16, on:true, last:'2 h ago', terms:['AI instagram post maker','tool to make social posts','tired of Canva']},
  {id:'hn', type:'forum', name:'Hacker News', glyph:'Y', hue:34, on:true, last:'2 h ago', terms:['social media for side project','automate posts']},
  {id:'own', type:'own', name:'Your list', glyph:'', hue:145, on:true},
];
const src = id => sources.find(s=>s.id===id);
sources.forEach(s=>{ if(s.type==='rival'){ s.glyph = s.name[0]; s.hue = hue(s.name); } s.color = tint(s.hue); });

const mapsBody = (first, co, hook) => `Hi ${first},\n\n${hook}\n\nFrekto turns a photo of your work into a ready post for Instagram and Facebook in about a minute. No design skills needed.\n\nWant me to make 3 free posts for ${co} so you can see?\n\nGopal\nFrekto`;
const rivalBody = (first, rival, pain) => `Hi ${first},\n\nI saw your review of ${rival}. ${pain}\n\nI make Frekto. You upload a photo and get a finished post with the caption written, in about a minute, at a flat price.\n\nIf you want, I can set up 2 weeks free so you can compare.\n\nGopal\nFrekto`;

let leads = [
  // Google Maps
  {src:'maps', name:'Bloom Salon', city:'Austin, TX', person:'Maya', email:'hello@bloomsalon.co', fit:4, why:'Great reviews, but last Instagram post was 5 months ago.', hook:'Your 4.9 stars on Google are impressive. I noticed your Instagram has been quiet since spring.'},
  {src:'maps', name:'Rise Bakery', city:'Austin, TX', person:'Tom', email:'orders@risebakery.com', fit:3, why:'Posts daily specials on a chalkboard, not online.', hook:'Your chalkboard specials look great in customer photos. They would do well on Instagram too.'},
  {src:'maps', name:'Ember Coffee', city:'Austin, TX', person:'Leo', email:'hi@embercoffee.com', fit:3, why:'Busy café, posts once a month.', stage:'contacted', sent:'Mon', fu:1},
  {src:'maps', name:'Northside Florist', city:'Austin, TX', person:'Sam', email:'flowers@northside.fl', fit:4, why:'Seasonal stock, no posts.', stage:'replied', sent:'Tue', fu:1, reply:'This sounds handy. Can we do a quick call Thursday afternoon?'},
  // competitors
  {src:'predis', name:'Hannah Cole', stars:1, ago:'2 d', fit:4, email:'hannah@coleceramics.com', title:'Captions sound like a robot', text:'Every caption it writes sounds the same. I spend more time fixing them than writing my own. Cancelled after 2 months.', why:'Sells handmade ceramics and posts daily. Wants captions that sound human.', pain:'The captions sounding the same is exactly what we fixed first.'},
  {src:'predis', name:'Marco Diaz', stars:2, ago:'4 d', fit:4, email:null, findable:true, foundEmail:'marco@diazcoffee.co', title:'Charged twice, no reply', text:'Got billed twice this month and support has not answered in a week.', why:'Runs a coffee roastery. Unhappy with billing and support.', pain:'Getting billed twice and waiting a week is rough.'},
  {src:'predis', name:'Priya Shah', stars:1, ago:'6 d', fit:3, email:null, findable:false, title:'Too expensive for a small shop', text:'The price went up again. For a two-person shop it is just too much.', why:'Two-person shop that finds the price too high.', pain:'You mentioned the price going up again.'},
  {src:'predis', name:'Grace Lin', stars:1, ago:'2 w', fit:4, email:'grace@linbakes.com', title:'Gave up after the update', text:'The new update broke scheduling to Instagram.', why:'Bakery that lost Instagram scheduling.', pain:'Losing Instagram scheduling after an update is painful.', stage:'replied', sent:'Last week', fu:1, reply:'Honestly yes, I would try it. Does it post to Instagram directly?'},

let view = 'all', starFilter = null, current = null, firstVisit = true, undoFn = null, sentToday = 3, limit = 20;
const settings = {auto:true, demo:true};
const $ = id => document.getElementById(id);
const visible = () => leads.filter(l => src(l.src)?.on && (view==='all' || l.src===view));
const todoOf = id => leads.filter(l=>l.src===id && l.stage==='todo').length;

/* ---------- top: sources ---------- */
function coin(s, big){
  const ring = s.type==='rival' ? `<span class="ring" style="background:conic-gradient(var(--hot) 0 ${(s.hist[0]+s.hist[1]+s.hist[2])/s.hist.reduce((a,b)=>a+b,0)*360}deg, var(--line) 0)"></span>` : '';
  const face = s.type==='own' ? `<span class="face" style="background:var(--accent-soft);color:var(--accent-text)">${I.list(16)}</span>` : `<span class="face" style="background:${s.color}">${esc(s.glyph)}</span>`;
  return `<span class="coin">${ring}${face}</span>`;
}
function subOf(s){
  const n = todoOf(s.id);
  if (s.type==='rival') return `${PLAT[s.plat].ic()}${n} to do`;
  if (s.type==='own') return `${leads.filter(l=>l.src==='own').length} people`;
  return `${n} to do`;
}
function renderSrcs(){
  const all = leads.filter(l=>l.stage==='todo' && src(l.src)?.on).length;
  const group = t => sources.filter(s=>s.type===t || (t==='forum' && s.type==='forum'));
  const btn = s => `<button class="coinbtn ${s.on?'':'off'}" data-v="${s.id}" aria-pressed="${view===s.id}" ${s.type==='rival'?'title="Competitor. Red part of the ring = unhappy reviews"':''}>${coin(s)}<span class="t"><b>${esc(s.name)}</b><small>${subOf(s)}</small></span>${s.fresh?`<span class="nb">${s.fresh}</span>`:''}</button>`;
  $('srcs').innerHTML = `<button class="coinbtn" data-v="all" aria-pressed="${view==='all'}"><span class="coin"><span class="face all">${I.search(16)}</span></span><span class="t"><b>All</b><small>${all} to do</small></span></button><span class="sep"></span>`
    + sources.filter(s=>s.type==='maps').map(btn).join('')
    + sources.filter(s=>s.type==='rival').map(btn).join('')
    + sources.filter(s=>s.type==='forum').map(btn).join('')
    + sources.filter(s=>s.type==='own').map(btn).join('')
    + `<button class="addsrc" id="addSrc" title="Add a competitor or place" aria-label="Add a source">${I.plus(20)}</button>`;
  $('srcs').querySelectorAll('.coinbtn').forEach(b=>b.onclick=()=>{ view=b.dataset.v; const s=src(view); if(s) s.fresh=0; starFilter=null; current=null; render(); });
  $('addSrc').onclick = openAddSource;
}

/* ---------- panel for the picked source ---------- */
const act = (label, id='go') => `<button class="actbtn" id="${id}">${I.refresh}${label}</button>`;
function renderHero(){
  const h = $('hero');
  if (view==='all'){
    const on = sources.filter(s=>s.on && s.type!=='own');
    const counts = on.map(s=>({s, n:todoOf(s.id)})).filter(x=>x.n);
    const total = counts.reduce((a,x)=>a+x.n,0);
    h.innerHTML = `<div class="radar" id="radar"><div class="sweep"></div><button class="go" id="go" title="Search every source now" aria-label="Search every source now">${I.search(22)}</button></div>
      <div class="grow mix"><p class="bigline"><b>${total}</b> people to reach</p>
        <div class="mixbar">${counts.map(x=>`<i style="width:${x.n/total*100}%;background:${mixColor(x.s)}" title="${esc(x.s.name)}: ${x.n}"></i>`).join('')}</div>
        <div class="mixkey">${counts.map(x=>`<span><i style="background:${mixColor(x.s)}"></i>${esc(x.s.name)} ${x.n}</span>`).join('')}</div>
        <div class="meta">${I.clock} ${settings.auto?'Searches every morning':'Searches only when you tap'}</div></div>`;
    $('go').onclick = searchAll;
    return;
  }
  const s = src(view);
  if (s.type==='rival'){
    const max = Math.max(...s.hist, 1);
    h.innerHTML = `<div class="hist" id="hist">${[5,4,3,2,1].map(n=>`<button class="hrow ${n<=3?'bad':''}" data-s="${n}" ${n<=3?'':'disabled'} aria-pressed="${starFilter===n}" title="${n<=3?'Show only '+n+'-star reviewers':'Happy customers: not leads'}">${stars(n,10,'s')}<span class="b"><i style="width:${s.hist[n-1]/max*100}%"></i></span><span class="c">${s.hist[n-1]}</span></button>`).join('')}</div>
      <div class="bignum" title="Unhappy reviewers who fit you"><b>${todoOf(s.id)}</b>to reach</div>
      <div class="act">${act('Read new reviews')}<div class="meta"><span class="plat">${PLAT[s.plat].ic()}${PLAT[s.plat].name}</span>${I.clock}${esc(s.last)}</div></div>`;
    h.querySelectorAll('.hrow.bad').forEach(b=>b.onclick=()=>{ const n=+b.dataset.s; starFilter = starFilter===n?null:n; renderHero(); renderBoard(); });
  } else if (s.type==='maps' || s.type==='forum'){
    h.innerHTML = `<span class="bigglyph" style="background:${s.color}">${s.type==='maps'?I.pin(28):esc(s.glyph)}</span>
      <div class="grow" style="display:flex;flex-direction:column;gap:10px">
        <div class="query" id="terms">${s.terms.map((t,i)=>`<span class="chip">${esc(t)}<button data-rm="${i}" aria-label="Remove ${esc(t)}">${I.xs}</button></span>`).join('')}<button class="chipadd" id="addTerm">${I.plus(14)}</button>
        ${s.type==='maps'?`<span class="lab">in</span><span class="chip place">${I.pin(13)}${esc(s.place)}</span>`:''}</div>
        <div class="meta">${I.clock} ${esc(s.last)}</div></div>
      <div class="act">${act('Search now')}</div>`;
    h.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ s.terms.splice(+b.dataset.rm,1); renderHero(); });
    $('addTerm').onclick = () => { const inp = document.createElement('input'); inp.className='chipin'; inp.placeholder = s.type==='maps'?'e.g. dentists':'e.g. need more followers'; $('addTerm').replaceWith(inp); inp.focus();
      const done = () => { if (inp.value.trim()) s.terms.push(inp.value.trim()); renderHero(); };
      inp.onkeydown = e => { if (e.key==='Enter') done(); if (e.key==='Escape') renderHero(); }; inp.onblur = done; };
  } else {
    const mine = leads.filter(l=>l.src==='own');
    h.innerHTML = `<button class="dropzone" id="drop"><span class="bigglyph">${I.file(28)}</span><span><b>Paste emails or drop a file</b>CSV, Excel, PDF, Word, text</span></button>
      <div class="bignum"><b>${mine.length}</b>people</div><div class="bignum"><b>${mine.filter(l=>l.stage!=='todo').length}</b>emailed</div>`;
    $('drop').onclick = () => openOwnList();
    return;
  }
  $('go').onclick = () => searchOne(s);
}

/* ---------- board ---------- */
const fitBars = n => `<span class="fit" title="Fit ${n} of 4">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`;
const fuDots = l => `<span class="fu" title="Follow-ups: ${l.fu} of 2 sent">${[0,1,2].map(i=>`<i class="${i<=l.fu?'on':''}"></i>`).join('')}</span>`;
function avatar(l, badge){
  const s = src(l.src);
  let a;
  if (l.kind==='post') a = `<span class="av" style="background:${s.color}">${esc(s.glyph)}</span>`;
  else if (s.type==='rival') a = `<span class="av round" style="background:${avBg(l.name)}">${esc(initials(l.name))}</span>`;
  else a = `<span class="av" style="background:${avBg(l.name)}">${esc(l.name[0])}</span>`;
  const b = badge && l.kind!=='post' ? `<span class="badge" style="background:${s.type==='own'?'var(--accent-soft)':s.color}" title="${esc(s.name)}">${s.type==='own'?I.list(10):s.type==='maps'?'M':esc(s.glyph)}</span>` : '';
  return `<span class="avw">${a}${b}</span>`;
}
function tileSub(l){
  const s = src(l.src);
  if (l.kind==='post') return `${esc(l.where)} · ${esc(l.ago)}`;
  if (s.type==='rival') return `${stars(l.stars,11)}${view==='all'?esc(s.name):esc(l.ago)}`;
  if (s.type==='own') return `${I.list(12)}Your list`;
  return `${I.pin()}${esc(l.city)}`;
}
function tileRight(l){
  if (l.stage==='todo') return `${l.kind==='email' && !l.email ? `<span class="noemail" title="Email not found yet">${I.at}</span>`:''}${fitBars(l.fit)}`;
  if (l.stage==='contacted') return l.kind==='post' ? `<span class="posted" title="You posted a reply">${I.check(16)}</span>` : fuDots(l);
  return '<span class="rdot"></span>';
}
function renderBoard(){
  const lanes = [{k:'todo',t:'To do',ic:I.eye},{k:'contacted',t:'Contacted',ic:I.send},{k:'replied',t:'Replied',ic:I.reply}];
  const list = visible();
  $('board').innerHTML = lanes.map(L=>{
    let its = list.filter(l=>l.stage===L.k);
    if (L.k==='todo'){ its.sort((a,b)=>b.fit-a.fit); if (starFilter) its = its.filter(l=>l.stars===starFilter); }
    let tiles = its.map((l,i)=>`<button class="tile ${l.isNew?'new':''} ${L.k==='replied'?'replied':''} ${current===l.id?'sel':''}" data-id="${l.id}">
        ${firstVisit && L.k==='todo' && i===0 ? '<span class="start">Start here</span>':''}
        ${avatar(l, view==='all')}<span class="t"><span class="name">${esc(l.name)}</span><span class="sub">${tileSub(l)}</span></span><span class="right">${tileRight(l)}</span></button>`).join('');
    if (!its.length) tiles = `<div class="empty"><div>${I.inbox}${L.k==='todo'?(starFilter?'No one at this rating.':'All done here. Search again or pick another source.'):L.k==='replied'?'Replies land here.':'Nothing yet.'}</div></div>`;
    const pill = L.k==='todo' && starFilter ? `<span class="filterpill">${stars(starFilter,11)}<button id="clearF" aria-label="Show all ratings">${I.xs}</button></span>` : '';
    const setAside = list.filter(l=>l.stage==='done').length + (view==='all' ? Object.values(nofit).flat().length : (nofit[view]||[]).length);
    const more = L.k==='todo' && setAside ? `<button class="linkbtn" id="showNo">+ ${setAside} not a fit or skipped</button>` : '';
    return `<section class="lane l-${L.k}"><div class="lane-h"><span class="dot">${L.ic}</span><b>${L.t}</b><span class="n">${its.length}</span></div>${pill}${tiles}${more}</section>`;
  }).join('');
  leads.forEach(l=>delete l.isNew);
  $('board').querySelectorAll('.tile').forEach(t=>t.onclick=()=>openLead(+t.dataset.id));
  $('clearF') && ($('clearF').onclick = () => { starFilter=null; renderHero(); renderBoard(); });
  $('showNo') && ($('showNo').onclick = openSetAside);
  const s = src(view);
  $('legend').innerHTML = [
    `<span>${fitBars(4)} how good a fit</span>`,
    (!s || s.type==='rival') && `<span>${stars(1,11)} what they gave a competitor</span>`,
    (!s || s.type!=='forum') && `<span><span class="noemail">${I.at}</span> email not found yet</span>`,
    (!s || s.type!=='forum') && `<span>${fuDots({fu:1})} follow-ups, stop when they reply</span>`,
    (!s || s.type==='forum') && `<span><span class="posted">${I.check(14)}</span> you posted a reply</span>`,
    (!s || s.type!=='forum') && `<span><span class="rdot"></span> they replied</span>`,
  ].filter(Boolean).join('');
}
function renderMeter(){ $('sentToday').textContent = sentToday; $('limit').textContent = limit; $('sentBar').style.width = Math.min(100, sentToday/limit*100)+'%'; }
function render(){ renderSrcs(); renderHero(); renderBoard(); renderMeter(); }

/* ---------- drawer ---------- */
function openDrawer(html){ $('drawer').innerHTML = html; $('drawer').classList.add('on'); $('scrim').classList.add('on'); $('drawer').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeDrawer); }
function closeDrawer(){ $('drawer').classList.remove('on'); $('scrim').classList.remove('on'); current=null; renderBoard(); }
$('scrim').onclick = closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
const head = (av, title, sub) => `<div class="d-head">${av}<div style="min-width:0"><h2>${esc(title)}</h2><div class="sub">${sub}</div></div><button class="iconbtn x" data-close aria-label="Close">${I.x}</button></div>`;
function srcLine(l){
  const s = src(l.src);
  if (l.kind==='post') return `${esc(s.name)} · ${esc(l.ago)} ago`;
  if (s.type==='rival') return `${stars(l.stars,12)} on ${esc(s.name)}`;
  if (s.type==='own') return `${I.list(12)} Your list`;
  return `${I.pin(13)} ${esc(l.city)} · Google Maps`;
}
const reviewCard = l => { const s = src(l.src); return `<div class="review"><span class="q">“</span>${stars(l.stars,15)}<h4>${esc(l.title)}</h4><p>${esc(l.text)}</p>
  <div class="foot">${PLAT[s.plat].ic()}${esc(s.name)} · ${esc(l.ago)} ago<a href="https://www.trustpilot.com" target="_blank" rel="noopener">Open ${I.out()}</a></div></div>`; };

function openLead(id){
  const l = leads.find(x=>x.id===id); if(!l) return;
  current = id; firstVisit = false; renderBoard();
  if (l.kind==='post') return openPost(l);
  if (l.stage==='todo') return openEmail(l);
  if (l.stage==='contacted') return openSent(l);
  if (l.stage==='replied') return openReplied(l);
}
function todoQueue(){ return visible().filter(x=>x.stage==='todo' && (!starFilter || x.stars===starFilter)).sort((a,b)=>b.fit-a.fit); }

function openEmail(l){
  const s = src(l.src), left = todoQueue().length;
  if (!l.subject){
    if (s.type==='rival'){ l.subject = `About your ${s.name} review`; l.body = rivalBody(firstOf(l), s.name, l.pain); }
    else { l.subject = `A few posts for ${l.name}?`; l.body = mapsBody(firstOf(l), l.name, l.hook || ''); }
  }
  openDrawer(`${head(avatar(l), l.name, srcLine(l))}
    <div class="d-body">
      ${s.type==='rival' ? reviewCard(l) : ''}
      <div class="why">${I.spark}<span>${esc(l.why)}</span></div>
      <div class="letter"><div class="to" id="toRow"></div>
        <div class="draft" id="draft"><input class="subj" id="subj" value="${esc(l.subject)}" aria-label="Subject"><textarea id="bodyTxt" aria-label="Email">${esc(l.body)}</textarea></div></div>
      <div class="hint">${I.clock} 2 follow-ups go out by themselves · they stop when they reply</div>
    </div>
    <div class="d-foot"><button class="btn ghost" id="skip">Skip</button><button class="btn primary" id="send">${I.send} Send <span style="opacity:.6;font-weight:500">${left>1?`· ${left-1} more`:''}</span></button></div>`);
  const lock = on => { $('draft').style.opacity = on?.4:1; $('draft').style.pointerEvents = on?'none':'auto'; $('send').disabled = on; };
  const toRow = () => {
    if (l.email){ $('toRow').innerHTML = `To <b>${esc(firstOf(l))}</b> ${esc(l.email)}<span class="found">${I.check(14)}</span>`; lock(false); return; }
    $('toRow').innerHTML = `${I.mail}<input id="em" type="email" placeholder="their email" aria-label="Their email"><button class="look" id="look">${I.search()}Find</button>`;
    lock(true);
    $('em').oninput = e => lock(!/^[^@\s]+@[^@\s]+\.\w+$/.test(e.target.value));
    $('look').onclick = () => { $('look').classList.add('on'); $('look').disabled = true; setTimeout(()=>{
      if (l.findable){ l.email = l.foundEmail; toRow(); toast(`Found ${l.email}`); }
      else { $('look').remove(); $('toRow').insertAdjacentHTML('afterend', `<div class="nofind">${I.xs} Not found. Type it if you know it.</div>`); $('em').focus(); }
    }, 1100); };
  };
  toRow();
  $('subj').oninput = e => l.subject = e.target.value;
  $('bodyTxt').oninput = e => l.body = e.target.value;
  $('send').onclick = () => { if(!l.email) l.email = $('em').value; move(l,'contacted',`Sent to ${l.name}`, () => { l.sent='Today'; l.fu=0; sentToday++; renderMeter(); }, () => { sentToday--; renderMeter(); }); };
  $('skip').onclick = () => move(l,'done',`Skipped ${l.name}`);
}
function openSent(l){
  const steps = [{lbl:'Your email', when:l.sent, done:true},{lbl:'Follow-up 1', when:l.fu>=1?'Sent':'In 3 days', done:l.fu>=1},{lbl:'Follow-up 2', when:l.fu>=2?'Sent':'In 7 days', done:l.fu>=2}];
  openDrawer(`${head(avatar(l), l.name, srcLine(l))}
    <div class="d-body">
      <div class="timeline">${steps.map(s=>`<div class="step ${s.done?'done':''}"><span class="p">${s.done?I.check(12):''}</span><span>${s.lbl}</span><span class="when">${s.when}</span></div>`).join('')}
        <div class="step"><span class="p"></span><span style="color:var(--faint)">Waiting for a reply</span><span></span></div></div>
      ${src(l.src).type==='rival' ? reviewCard(l) : ''}
    </div>
    <div class="d-foot"><button class="btn ghost" id="stopFu" style="flex:1">${I.stop} Stop follow-ups</button></div>`);
  $('stopFu').onclick = () => move(l,'done',`Stopped follow-ups for ${l.name}`);
}
function openReplied(l){
  openDrawer(`${head(avatar(l), l.name, srcLine(l))}
    <div class="d-body">
      <div class="msg us"><div class="who">You · ${esc(l.sent)}</div>${esc(l.subject || (src(l.src).type==='rival'?`About your ${src(l.src).name} review`:`A few posts for ${l.name}?`))}</div>
      <div class="msg them"><div class="who">${esc(firstOf(l))} · today</div>${esc(l.reply)}</div>
      <div class="hint">${I.check(14)} Follow-ups stopped</div>
    </div>
    <div class="d-foot"><button class="btn ghost" id="arch">Done</button><a class="btn primary" href="https://mail.google.com" target="_blank" rel="noopener">${I.out(16)} Reply in Gmail</a></div>`);
  $('arch').onclick = () => move(l,'done',`Moved ${l.name} to done`);
}
function openPost(l){
  const s = src(l.src), posted = l.stage==='contacted';
  openDrawer(`${head(avatar(l), l.where, srcLine(l))}
    <div class="d-body">
      <div class="msg post"><div class="who">${esc(l.name)}</div>${esc(l.post)}</div>

function move(l, stage, msg, after, undoAfter){

function addFresh(s){
  const pool = (fresh[s.id]||[]).splice(0);
  s.last = 'just now';
  pool.forEach(n=>{ leads.push(prep({...n, isNew:true})); if (s.hist) s.hist[n.stars-1]++; });
  if (s.hist) s.hist[4] += 3;
  if (view!==s.id && view!=='all') s.fresh = (s.fresh||0) + pool.length;
  return pool.length;
}
function searchOne(s){
  const b = $('go'); if (!b || b.classList.contains('on')) return;
  b.classList.add('on'); $('hero').classList.add('reading');
  setTimeout(()=>{
    $('hero').classList.remove('reading');

    render();

  }, 1600);
}
function searchAll(){

}

function parsePeople(raw){
  const seen = new Set(), known = new Set(leads.filter(l=>l.email).map(l=>l.email.split('@')[1]));
  return raw.split(/\n+/).map(line=>{
    const m = line.match(/[\w.+-]+@[\w-]+\.[\w.]+/); if(!m) return null;
    const email = m[0].toLowerCase(), dom = email.split('@')[1];
    const bits = line.replace(m[0],'').split(',').map(s=>s.trim()).filter(Boolean);
    const person = bits.find(s=>/^[A-Z][a-z]+( [A-Z][a-z]+)?$/.test(s) && !/(Pets|Bikes|Shop|Cafe|Co)$/.test(s));
    const company = bits.find(s=>s!==person) || dom.split('.')[0].replace(/^\w/,c=>c.toUpperCase());
    const first = person ? person.split(' ')[0] : email.split('@')[0];
    let skip = '';
    if (seen.has(email)) skip = 'Repeat'; else if (/optedout/.test(email)) skip = 'Opted out'; else if (known.has(dom)) skip = 'Already a lead';
    seen.add(email);
    return {email, first: first[0].toUpperCase()+first.slice(1), company, skip};
  }).filter(Boolean);
}
function peopleHtml(ppl){ return ppl.map(p=>`<span class="person ${p.skip?'skip':''}" title="${esc(p.skip||p.email)}"><span class="av" style="background:${avBg(p.email)}">${esc(p.first[0])}</span>${esc(p.first)}</span>`).join(''); }

  : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10Z"/></svg>';
function toggleTheme(){ document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; $('theme').innerHTML = themeIcon(); }
const openSb = on => { $('sb').classList.toggle('open', on); $('sbScrim').classList.toggle('on', on); };
$('menu').onclick = () => openSb(true); $('sbClose').onclick = () => openSb(false); $('sbScrim').onclick = () => openSb(false);

function renderSub(){
  const last = view==='all' ? 'Last search 2 h ago' : (src(view).last ? `${src(view).name}: ${src(view).last}` : '');
  $('thSub').innerHTML = `${settings.auto?'<span class="th-chip">Searching daily</span>':''}${settings.demo?'<span class="th-chip demo">Demo mode</span>':''}${last?`<span>${esc(last)}</span>`:''}<button class="th-link" id="about">About this page</button>`;
  $('about').onclick = openAbout;
}
function openAbout(){
  openDrawer(`${head(`<span class="av" style="background:var(--accent-soft);color:var(--accent-text)">${I.search(20)}</span>`, 'Lead Finder', 'How it works')}
    <div class="d-body"><div class="about-steps">
      <div class="about-step"><span class="n">1</span><span><b>It looks for people</b><small>Local businesses on Google Maps, unhappy reviewers of your competitors, and posts asking for a tool like yours.</small></span></div>
      <div class="about-step"><span class="n">2</span><span><b>You check each one</b><small>Read why they fit and the email or reply it wrote. Change anything, then send or skip.</small></span></div>
      <div class="about-step"><span class="n">3</span><span><b>Follow-ups go out by themselves</b><small>Two reminders, a few days apart. They stop as soon as someone replies.</small></span></div>
    </div></div>
    <div class="d-foot"><button class="btn primary" data-close>Got it</button></div>`);
}
const _render = render;
render = function(){ _render(); renderSub(); };

renderNav();
render();
</script>
