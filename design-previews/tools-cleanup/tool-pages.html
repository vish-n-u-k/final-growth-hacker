<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GrowJin Tools Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Layout: app frame (sidebar + tool page); every tool fills the same slots. */
  :root {
    --bg: #ffffff; --bg-soft: #eef1ee; --bg-tint: #f7f9f7; --line: #dfe4df;
    --text: #16201a; --text-dim: #4c5a50; --text-faint: #7d8a80;
    --green: #15803d; --accent: #e3f3e8; --accent-fg: #0f5a2b;
    --warn: #b45309; --warn-soft: #fdf1df; --crit: #b42318; --crit-soft: #fdeceb; --info: #1d4ed8; --info-soft: #e8efff; --star: #e2a400;
    --display: 'Fraunces', Georgia, serif; --body: 'Outfit', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); }
  button, input, select, textarea { font-family: inherit; }
  a { color: inherit; }


  /* app shell: sidebar + page, like components/AppSidebar */
  .frame { display: flex; min-height: 100vh; }
  .side { width: 232px; flex: none; background: var(--bg-soft); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; font-size: 13px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 6px 8px 18px; font: 700 15px var(--display); color: var(--text); letter-spacing: -.2px; }
  .gl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); padding: 0 10px 8px; }
  .grp { margin-bottom: 16px; }
  .nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; border: 0; background: transparent; color: var(--text-dim); font: 500 13px var(--body); text-align: left; margin-bottom: 2px; text-decoration: none; cursor: pointer; }
  .nav:hover { background: #fff; color: var(--text); }
  .nav.on { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
  .nav svg { flex: none; }
  .rm-title { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); padding: 4px 10px 6px; }
  .rm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--text-dim); font: 500 13.5px var(--body); cursor: pointer; text-align: left; }
  .rm:hover { background: #fff; color: var(--text); }
  .rm .chev { flex: none; color: var(--text-faint); }
  .rm .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rm .ct { font-size: 11.5px; font-weight: 600; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .rm .bar { flex-basis: 100%; height: 3px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 3px 0 0 18px; width: calc(100% - 18px); }
  .rm .bar i { display: block; height: 100%; border-radius: 99px; }
  .foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); }
  .ws { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; }
  .ws .avt { width: 26px; height: 26px; border-radius: 50%; background: var(--text); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .ws b { font-size: 12.5px; }
  .ws .pro { margin-left: auto; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: #fbf2d5; color: #7a5a08; }
  .main { flex: 1; min-width: 0; }
  .page { max-width: 1140px; margin: 0 auto; padding: 0 36px 80px; }
  .mbar { display: none; }
  @media (max-width: 760px) {
    .side { display: none; }
    .page { padding: 0 16px 56px; }
    .mbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 30; padding: 10px 16px; background: var(--bg-soft); border-bottom: 1px solid var(--line); }
    .mbar b { font: 700 15px var(--display); }
    .mbar select { margin-left: auto; height: 36px; border: 1px solid var(--line); border-radius: 9px; padding: 0 8px; font: 600 13px var(--body); background: #fff; color: var(--text); }
  }

  /* header + intro */
  .hd { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; padding: 20px 0 18px; }
  .hd-l, .hd-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hd-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font-size: 16px; }
  .hd h1 { font: 600 24px/1.2 var(--display); margin: 0; }
  .meta { font-size: 13px; color: var(--text-faint); }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--bg-soft); color: var(--text-dim); white-space: nowrap; }
  .chip.ok { background: var(--accent); color: var(--accent-fg); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .link { font-size: 13px; font-weight: 600; color: var(--accent-fg); text-decoration: none; white-space: nowrap; background: none; border: 0; padding: 0; cursor: pointer; }
  .intro { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--bg-soft); font-size: 14px; color: var(--text-dim); margin-bottom: 24px; }
  .intro span { flex: 1; }
  .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: -12px 0 24px; }
  .how div { padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); font-size: 13.5px; line-height: 1.5; color: var(--text-dim); }
  .how b { display: block; color: var(--text); margin-bottom: 4px; }
  .how i { font-style: normal; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 12px; margin-right: 6px; }

  /* buttons */
  .btn { height: 38px; padding: 0 18px; border-radius: 10px; font: 600 13.5px var(--body); border: 1px solid var(--line); background: #fff; color: var(--text-dim); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: background .15s, border-color .15s, box-shadow .15s; }
  .btn:hover { border-color: var(--green); color: var(--text); }
  .btn.pri { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 2px 8px rgba(21,128,61,.25); }
  .btn.pri:hover { box-shadow: 0 4px 12px rgba(21,128,61,.35); }
  .btn.out { border: 1.5px solid var(--green); color: var(--green); }
  .btn.sm { height: 34px; padding: 0 14px; font-size: 13px; }
  .btn.lg { height: 46px; padding: 0 24px; font-size: 15px; }
  .btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
  .btn:focus-visible, .tabs button:focus-visible, .lane button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  /* the shared "action bar" (option 1) */
  .abar { display: flex; align-items: center; gap: 14px 20px; flex-wrap: wrap; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 20px; }
  .abar-ctx { flex: 1; min-width: 180px; display: grid; gap: 4px; }
  .abar-ctx b { font-size: 15px; }
  .abar-r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lane { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--bg-soft); }
  .lane button { flex: 1; border: 0; background: none; padding: 8px 14px; border-radius: 9px; font: 600 13.5px var(--body); color: var(--text-dim); cursor: pointer; white-space: nowrap; }
  .lane button[aria-selected="true"] { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .lane em { font-style: normal; margin-left: 6px; font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--bg-soft); overflow-x: auto; max-width: 100%; }
  .tabs button { flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; background: none; padding: 8px 14px; border-radius: 9px; font: 500 13.5px var(--body); color: var(--text-dim); cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: #fff; color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tabs span { min-width: 22px; padding: 0 7px; border-radius: 99px; background: #fff; font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .tabs button[aria-selected="true"] span { background: var(--accent); color: var(--accent-fg); }
  .tabs span.hot { background: var(--crit); color: #fff; }
  .search { flex: 1 1 200px; min-width: 140px; height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font-size: 14px; }
  .sel { height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font: 500 13.5px var(--body); color: var(--text-dim); background: #fff; }
  .search:focus, .sel:focus { outline: none; border-color: var(--green); }
  .count { font-size: 13.5px; color: var(--text-faint); margin: 0 2px 14px; }
  .count b { color: var(--text); }

  /* cards */
  .card { border: 1px solid var(--line); border-radius: 16px; background: #fff; margin-bottom: 14px; overflow: hidden; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.05); }
  .c-head { display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px 0; }
  .av { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--bg-soft); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--text-dim); }
  .av.sq { border-radius: 11px; }
  .who { flex: 1; min-width: 0; }
  .name { font-size: 15.5px; font-weight: 600; line-height: 1.35; }
  .sub { font-size: 13px; color: var(--text-faint); margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stars { color: var(--star); letter-spacing: 1px; font-size: 12px; } .stars s { color: #d9ddd9; text-decoration: none; }
  .src { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--info-soft); color: var(--info); }
  .src.orange { background: #ffeadf; color: #c2410c; } .src.amber { background: var(--warn-soft); color: var(--warn); } .src.green { background: var(--accent); color: var(--accent-fg); } .src.red { background: var(--crit-soft); color: var(--crit); }
  .badge { flex: none; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); white-space: nowrap; }
  .badge.amber { background: var(--warn-soft); color: var(--warn); } .badge.red { background: var(--crit-soft); color: var(--crit); } .badge.grey { background: var(--bg-soft); color: var(--text-dim); }
  .c-body { padding: 10px 20px 18px 74px; }
  .said { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .why { margin: 10px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--accent-fg); display: flex; gap: 8px; }
  .why::before { content: '✓'; font-weight: 700; }
  .c-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 10px 20px; border-top: 1px solid var(--line); background: var(--bg-tint); }
  .c-state { font-size: 13px; color: var(--text-faint); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--bg-soft); color: var(--text-dim); }
  .tag.ok { background: var(--accent); color: var(--accent-fg); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.crit { background: var(--crit-soft); color: var(--crit); }
  .c-foot .btn { min-width: 140px; }
  .empty { text-align: center; padding: 48px 20px; border: 1px dashed var(--line); border-radius: 16px; color: var(--text-faint); font-size: 14px; }

  /* first visit */
  .first { text-align: center; padding: 48px 28px 40px; border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(180deg, #f2f8f4, #fff 60%); }
  .first .big { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; margin: 0 auto 18px; background: var(--green); color: #fff; font-size: 28px; box-shadow: 0 8px 20px rgba(21,128,61,.25); }
  .first h2 { font: 600 26px/1.25 var(--display); margin: 0 0 10px; text-wrap: balance; }
  .first > p { margin: 0 auto 28px; max-width: 480px; font-size: 15px; line-height: 1.6; color: var(--text-dim); }
  .first form { max-width: 540px; margin: 0 auto; display: grid; gap: 14px; text-align: left; }
  .first label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-dim); }
  .first input[type=text], .first textarea { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 400 15px var(--body); color: var(--text); background: #fff; }
  .first input:focus, .first textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(21,128,61,.12); }
  .first .chks { display: grid; gap: 8px; }
  .first .chk { display: flex; gap: 10px; align-items: center; font-weight: 500; color: var(--text); font-size: 14px; }
  .first .chk input { accent-color: var(--green); width: 17px; height: 17px; }
  .first .seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--bg-soft); justify-self: center; }
  .first .seg button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; font: 500 14px var(--body); color: var(--text-dim); cursor: pointer; }
  .first .seg button[aria-pressed="true"] { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .first .picks { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--text-faint); align-items: center; }
  .first .picks button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font: 500 13px var(--body); color: var(--text-dim); cursor: pointer; }
  .first .picks button:hover { border-color: var(--green); }
  .first .fine { display: flex; gap: 8px 22px; justify-content: center; flex-wrap: wrap; margin-top: 24px; font-size: 13px; color: var(--text-faint); }
  .first .fine span::before { content: '✓ '; color: var(--green); font-weight: 700; }

  /* progress */
  .prog { border: 1px solid var(--green); background: var(--accent); border-radius: 16px; padding: 20px 22px; margin-bottom: 20px; }
  .prog-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .prog-top b { font-size: 15px; }
  .prog ol { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; font-size: 14px; color: var(--text-faint); }
  .prog li.p-done { color: var(--accent-fg); }
  .prog li.p-on { color: var(--text); font-weight: 700; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; border-top-color: var(--green); animation: sp .8s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  /* side panel (settings / earlier scans) */
  .panel { border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; margin-bottom: 20px; }
  .panel h3 { margin: 0 0 4px; font: 600 18px var(--display); }
  .panel .hint { margin: 0 0 16px; font-size: 13.5px; color: var(--text-faint); }
  .panel .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-dim); }
  .panel input[type=text], .panel textarea { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 400 14px var(--body); color: var(--text); }
  .panel .full { grid-column: 1 / -1; }
  .panel .chk { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; font-size: 14px; color: var(--text); }
  .panel .chk input { margin-top: 3px; accent-color: var(--green); width: 16px; height: 16px; }
  .panel .chk small { display: block; color: var(--text-faint); font-weight: 400; font-size: 12.5px; margin-top: 2px; }
  .panel .acts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .hist { display: grid; gap: 8px; }
  .hist button { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font: 500 14px var(--body); cursor: pointer; }
  .hist button:hover { border-color: var(--green); }
  .hist span { font-size: 12.5px; color: var(--text-faint); }

  /* detail: same as the Competitor Leads reach-out page */
  .crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--text-faint); margin: 0 0 20px; }
  .crumbs b { color: var(--text); }
  .ro { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .ro-side { position: sticky; top: 76px; display: grid; gap: 14px; padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg-soft); }
  .ro-person { display: flex; align-items: center; gap: 12px; }
  .ro-person .av { background: #fff; width: 46px; height: 46px; }
  .ro-person h2 { margin: 0; font: 600 18px/1.25 var(--display); }
  .ro-quote { margin: 0; padding: 14px 16px; border-radius: 14px; background: #fff; font-size: 14px; line-height: 1.65; }
  .ro-src { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--text-faint); }
  .steps { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; padding: 0; list-style: none; }
  .step { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 13.5px; color: var(--text-faint); }
  .step:last-child { flex: none; }
  .step:not(:last-child)::after { content: ''; flex: 1; height: 2px; background: var(--line); min-width: 10px; border-radius: 2px; }
  .step.past:not(:last-child)::after { background: var(--green); }
  .step .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: #fff; font-size: 12.5px; font-weight: 700; }
  .step.on { color: var(--text); font-weight: 700; }
  .step.on .n { border-color: var(--green); color: var(--green); box-shadow: 0 0 0 4px rgba(21,128,61,.12); }
  .step.past .n { background: var(--green); border-color: var(--green); color: #fff; }
  .pane { border: 1px solid var(--line); border-radius: 18px; background: #fff; overflow: hidden; }
  .pane-in { padding: 26px 28px; }
  .pane h3 { margin: 0; font: 600 21px/1.3 var(--display); }
  .pane .hint { margin: 8px 0 20px; font-size: 14px; color: var(--text-dim); line-height: 1.55; min-height: 1.5em; }
  .fitbox { padding: 16px 18px; border-radius: 14px; background: var(--bg-soft); font-size: 14px; line-height: 1.55; }
  .fitbox .top { display: flex; justify-content: space-between; font-weight: 700; color: var(--green); margin-bottom: 8px; }
  .meter { height: 6px; border-radius: 99px; background: #fff; margin-bottom: 10px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
  .ro-side .fitbox { background: #fff; border: 1px solid var(--line); }
  .found { display: flex; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--accent); color: var(--accent-fg); font-size: 13.5px; margin-bottom: 14px; }
  .found b { display: block; font-size: 14.5px; }
  .field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-dim); }
  .field input { height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font: 400 15px var(--body); }
  .mail { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .mail .r { display: flex; gap: 10px; align-items: center; padding: 0 16px; min-height: 46px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .mail .r span { width: 60px; color: var(--text-faint); font-size: 13px; }
  .mail .r input { flex: 1; border: 0; font: 500 14.5px var(--body); outline: none; min-width: 0; }
  .mail textarea { display: block; width: 100%; border: 0; padding: 16px; font: 400 14.5px/1.7 var(--body); resize: vertical; outline: none; min-height: 190px; }
  .mail .t { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--bg-tint); font-size: 12.5px; color: var(--text-faint); flex-wrap: wrap; }
  .mail .t .r2 { margin-left: auto; }
  .rule { padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 13.5px; margin-bottom: 14px; }
  .actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; padding: 16px 28px; border-top: 1px solid var(--line); background: var(--bg-tint); }
  .actions .back { margin-right: auto; }
  .done { text-align: center; padding: 8px 0; }
  .done .tick { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--green); display: grid; place-items: center; font-size: 22px; font-weight: 700; margin: 0 auto 14px; }

<script>
const BRAND = 'Frekto'
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;')
const stars = n => `<span class="stars">${'★'.repeat(n)}<s>${'★'.repeat(5 - n)}</s></span>`
const $ = s => document.querySelector(s)

// ── Two-step flows: the card already answered "is this worth it?", so the steps start at the work ──
const mail = (to, subject, body) => `<div class="mail"><label class="r"><span>To</span><input value="${esc(to)}"></label><label class="r"><span>Subject</span><input value="${esc(subject)}"></label><textarea aria-label="Message">${esc(body)}</textarea>
  <div class="t"><button class="btn sm" data-toast="Rewritten">↻ Rewrite</button><button class="btn sm" data-toast="Copied">Copy</button><span class="r2">Follow-up in 3 days if they don’t reply</span></div></div>`
const FLOWS = {
  email: {
    labels: ['Their email', 'Review & send'],
    steps: [
      it => ({ title: 'Where should it go?', hint: 'We looked up their email. Check it, or paste the right one.', body: (it.email ? `<div class="found"><span>✉</span><div><b>Found ${it.first}'s email</b>on their website · verified</div></div>` : `<div class="found warnbox"><span>?</span><div><b>No public email found</b>Paste it if you know it.</div></div>`) + `<label class="field">Email address<input value="${esc(it.email ?? '')}" placeholder="name@company.com"></label>`, next: 'Continue →' }),
      it => ({ title: 'Check the email, then send it', hint: 'Short and plain, from your Gmail. Edit anything.', body: mail(it.email ?? '', 'Posting without the hours', `Hi ${it.first},\n\n${BRAND} makes your social posts for you, on-brand and ready to schedule, usually in under a minute.\n\nWould a free week of posts help?\n\n${BRAND}`), next: 'Send email →' }),
    ],
    done: it => [`Email sent to ${it.first}`, 'From your Gmail. A follow-up goes out in 3 days if they don’t reply.'],
  },
  post: {
    labels: ['Check the reply', 'Post it'],
    steps: [
      it => ({ title: 'Check the reply', hint: 'Helpful answer first, your product second. Make it sound like you.', body: `<div class="rule">📌 ${esc(it.rule)}</div><div class="mail"><textarea aria-label="Reply">${esc(it.reply)}</textarea></div>`, next: 'Looks good →' }),
      it => ({ title: 'Post it on the thread', hint: 'Reddit and Hacker News don’t allow posting for you. Copy, open, paste.', body: `<div class="draft">${esc(it.reply).replace(/\n/g, '<br>')}</div><div class="row" style="margin:14px 0 0"><button class="btn out" data-toast="Reply copied">1 · Copy reply</button><button class="btn out" data-toast="Opening the post in a new tab">2 · Open post ↗</button></div>`, next: '3 · I’ve posted it' }),
    ],
    done: () => ['Marked as posted', 'We check the thread every day and tell you when someone answers.'],
  },
  thread: {

    <blockquote class="ro-quote">${esc(i.quote)}</blockquote><div class="fitbox"><div class="top"><span>Why them</span></div>${esc(i.why)}</div></aside>`
  let pane
  if (finished) {
    const acted = p.acted?.[i.id]
    const skipped = !acted && p.st[i.id] === 'done'
    const d = skipped ? ['Skipped', 'You skipped this one. Bring it back if you change your mind.'] : !acted && i.closed ? i.closed : f.done(i)
    const restore = skipped || (!acted && i.restore)
    const next = t.items.find(x => x.id !== i.id && stOf(x) === 'needs')
    pane = `<section class="pane"><div class="pane-in"><div class="done"><div class="tick ${skipped || (i.closed && !acted) ? 'grey' : ''}">${skipped ? '–' : '✓'}</div><h3>${d[0]}</h3><p>${d[1]}</p></div></div>
      <div class="actions"><button class="btn back" data-close>← Back to the list</button>${restore ? `<button class="btn out" data-restore="${i.id}">${i.restore ?? 'Bring it back'}</button>` : ''}${next ? `<button class="btn pri" data-open="${next.id}">Next: ${esc(next.first && next.first !== 'them' ? next.first : next.name.slice(0, 28) + (next.name.length > 28 ? '…' : ''))} →</button>` : ''}</div></section>`
  } else {
    pane = `<section class="pane"><div class="pane-in"><h3>${st.title}</h3><p class="hint">${st.hint}</p>${st.body}</div>
      <div class="actions">${p.step === 0 ? `<button class="btn back" data-skip="${i.id}">Skip</button>` : '<button class="btn back" data-back>← Back</button>'}<button class="btn pri" data-next>${st.next}</button></div></section>`
  }
  return `<nav class="crumbs"><button class="link" data-close>← ${t.title}</button><span>/</span><b>${esc(i.name.length > 44 ? i.name.slice(0, 44) + '…' : i.name)}</b></nav><div class="ro">${side}<div>${f.labels.length > 1 ? bar : ''}${pane}</div></div>`
}
function toolView() {
  const t = T(), p = P()
  const open = p.open && t.items.find(i => i.id === p.open)
  let h = header()
  if (open) return h + detail(open)
  if (S.tool === 'cl') {
    h += scanBar()
    if (p.running) return h + progress()
    if (p.phase === 'new') return h + `<div class="hello"><div class="hello-art"><span>★★☆☆☆</span>→<span>✉</span></div><p>Pick a competitor above. GrowJin reads their newest reviews and lists the unhappy customers ${BRAND} could help, each with an email ready to send.</p></div>`
    return h + tabs() + listArea()
  }
  h += agentBar()
  if (p.running) h += progress()
  return h + tabs() + (p.phase === 'new' && p.running ? '<div class="empty">Your first leads appear here in a moment.</div>' : listArea())
}

    <div class="gh-tabs" role="tablist">${[['inbox', 'Inbox'], ['camp', 'Campaigns'], ['follow', 'Follow-ups (3)']].map(([k, l]) => `<button class="gh-tab ${e.tab === k ? 'on' : ''}" data-emtab="${k}">${l}</button>`).join('')}</div>`
  let body = ''

    const list = THREADS.filter(t => e.filter === 'all' || (e.filter === 'leads' ? ['hot', 'warm'].includes(t.tag) : t.tag === e.filter))
    const t = THREADS.find(x => x.id === e.thread) ?? THREADS[0]
    const pills = [['all', 'All', THREADS.length], ['leads', 'Leads', 2], ['press', 'Press', 1], ['partnership', 'Partners', 1]]
    body = `<div class="gh-pills">${pills.map(([k, l, n]) => `<button class="gh-pill ${e.filter === k ? 'on' : ''}" data-emfilter="${k}">${l}<i>${n}</i></button>`).join('')}<span class="meta">${list.length} threads</span></div>
      <div class="gh-split"><div class="gh-list">${list.map(x => `<button class="gh-item ${x.id === t.id ? 'on' : ''} ${x.unread && !e.read?.[x.id] ? 'unread' : ''}" data-thread="${x.id}"><span class="av">${x.av}</span><span style="flex:1;min-width:0"><span class="gh-top"><span class="from" style="font-size:13.5px;color:var(--text)">${x.from}</span><span>${x.time}</span></span><div class="gh-subj">${x.subj}</div><div class="gh-prev">${x.prev}</div><span class="gtag ${x.tag}">${{ hot: 'Hot Lead', warm: 'Warm Lead', press: 'Press', partnership: 'Partnership' }[x.tag]}</span></span></button>`).join('')}</div>
      <div class="gh-detail"><div><h3>${t.subj}</h3><span class="meta">${t.from} · ${t.time}</span></div>
        <div class="gh-sum"><b>AI summary</b>${t.sum}</div>
        <div class="gh-msg"><span class="meta">${t.from} wrote</span>${t.msg}</div>
        <div class="gh-reply"><b style="font-size:13px">Drafted reply</b><textarea aria-label="Reply">${esc(t.draft)}</textarea></div>
        <div class="gh-acts"><button class="btn pri" data-toast="Reply sent from your Gmail">Send reply</button><button class="btn" data-toast="Copied">Copy</button><button class="btn" data-toast="Follow-up reminder set for 5 days">🔔 Remind me in 5 days</button></div></div></div>`
  } else if (e.tab === 'camp') {
    const st = e.camp ?? 'idle'
    body = `<div class="gh-sec"><h4><i>1</i>What is this campaign about?</h4><textarea rows="2" aria-label="Campaign">Offer café owners a free week of on-brand Instagram posts.</textarea></div>
      <div class="gh-sec"><h4><i>2</i>Who should get it?</h4><input aria-label="Recipients" placeholder="alice@acme.com, Alice Johnson, acme.com"><div class="gh-chips"><span>alice@acme.com</span><span>bob@brewhouse.co</span><span>hi@lumencandles.com</span></div></div>
      <div class="gh-sec"><h4><i>3</i>Generate &amp; send <span class="meta" style="font-weight:400">${st === 'idle' ? '0/3 generated' : '3/3 generated'}</span><span style="margin-left:auto;display:flex;gap:8px">${st === 'idle' ? '<button class="btn sm out" data-camp="ready">✦ Generate all</button>' : st === 'ready' ? '<button class="btn sm pri" data-camp="sent">Send all ready (3)</button>' : '<span class="tag ok">✓ 3 sent</span>'}</span></h4>
        <div class="gh-tbl-wrap"><table class="gh-table"><thead><tr><th>Email</th><th>Name</th><th>Status</th><th></th></tr></thead><tbody>

  } else {

      ${FU.map((f, i) => `<div class="gh-fu"><span class="av">${f.av}</span><div><b>${f.name}</b><span class="meta">${f.subj} · ${f.when}</span></div>${e.fu?.[i] === 'sent' ? '<span class="tag ok">✓ Follow-up sent</span>' : e.fu?.[i] === 'draft' ? `<button class="btn sm pri" data-fusend="${i}">Send follow-up</button>` : `<button class="btn sm out" data-fudraft="${i}">Draft follow-up</button>`}</div>

function emClick(b, d) {
  const e = S.em
  if ('how' in d) { e.how = !e.how; render(); return }
  if (d.emtab) { e.tab = d.emtab; render(); return }
  if (d.emfilter) { e.filter = d.emfilter; render(); return }
  if (d.thread) { e.thread = d.thread; (e.read ||= {})[d.thread] = true; render(); return }
  if ('nobanner' in d) { e.banner = false; render(); return }
  if (d.camp) { e.camp = d.camp; render(); if (d.camp === 'sent') toast('3 emails sent from your Gmail'); return }
  if (d.fudraft) { (e.fu ||= {})[d.fudraft] = 'draft'; render(); return }
  if (d.fusend) { e.fu[d.fusend] = 'sent'; render(); toast('Follow-up sent'); return }
  if (d.toast) { toast(d.toast); return }
}


function render() {
  document.querySelectorAll('.side [data-tool]').forEach(a => a.classList.toggle('on', a.dataset.tool === S.tool))
  const mn = $('#mnav'); if (mn) mn.value = S.tool
  $('#view').innerHTML = S.tool === 'em' ? emView() : toolView()
  $('#toastHost').innerHTML = S.toast ? `<div class="toast" role="status">${esc(S.toast)}${S.undo ? ' <button class="link undo" data-undo>Undo</button>' : ''}</div>` : ''
}
function toast(msg, undo = null) { S.toast = msg; S.undo = undo; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ''; S.undo = null; render() }, 3200) }
function run(msg) {
  const p = P(), n = T().progress.length, tool = S.tool
  p.running = true; p.pstep = 0; p.panel = false; render()
  const tick = () => { const q = S[tool]; q.pstep++; if (q.pstep >= n) { q.running = false; q.phase = 'ready'; if (S.tool === tool) { render(); toast(msg) } } else { if (S.tool === tool) render(); setTimeout(tick, 600) } }
  setTimeout(tick, 600)
}
// Lead Agent and Search Agent start working the first time they're opened: nothing to fill in first
function openTool(k) {
  S.tool = k; render(); window.scrollTo({ top: 0 })
  const p = S[k]
  if ((k === 'la' || k === 'sa') && p.phase === 'new' && !p.running) run(k === 'la' ? '7 leads need you' : 'This week’s to-do list is ready')
}

document.addEventListener('submit', e => {
  if (e.target.id !== 'scanForm') return
  e.preventDefault()
  const p = S.cl
  p.target = ($('#scanIn').value || 'buffer.com').trim(); p.earlier = false; p.tab = 'needs'
  run('3 good fits found')
})
document.addEventListener('change', e => {
  if (e.target.id === 'mnav') openTool(e.target.value)
  if (e.target.id === 'src') { P().src = e.target.value; render() }
})
document.addEventListener('input', e => { if (e.target.id === 'q') { P().q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos) } })
document.addEventListener('click', e => {
  const b = e.target.closest('button, a'); if (!b) return
  const d = b.dataset
  if (b.tagName === 'A' && b.getAttribute('href') === '#') e.preventDefault()
  if (d.other) { toast(`${d.other} isn’t part of this preview`); return }
  if (d.tool) { openTool(d.tool); return }
  if (d.goto) { openTool(d.goto); return }
  if (S.tool === 'em') return emClick(b, d)
  const p = P()
  if ('how' in d) { p.how = !p.how; render(); return }
  if ('seg' in d) { b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); return }
  if (d.fill) { $('#scanIn').value = d.fill; return }
  if ('earlier' in d) { p.earlier = !p.earlier; render(); return }
  if (d.pickScan) { p.target = d.pickScan; p.earlier = false; render(); toast(`Showing your ${d.pickScan} scan`); return }
  if ('panel' in d) { p.panel = !p.panel; render(); return }
  if ('closePanel' in d) { p.panel = false; render(); if (d.toast) toast(d.toast); return }
  if ('primary' in d) { run(S.tool === 'la' ? '2 new leads found' : 'Research updated'); return }
  if (d.tab) { p.tab = d.tab; render(); return }
  if ('clear' in d) { p.q = ''; p.src = ''; render(); return }
  if (d.open) { p.open = d.open; p.step = 0; render(); window.scrollTo({ top: 0 }); return }
  if ('close' in d) { p.open = null; render(); return }
  if ('back' in d) { p.step = Math.max(0, p.step - 1); render(); return }
  if (d.skip) { const id = d.skip, prev = p.st[id]; p.st[id] = 'done'; p.open = null; render(); toast('Skipped. Moved to Done.', () => { p.st[id] = prev; if (prev === undefined) delete p.st[id] }); return }
  if ('undo' in d) { S.undo?.(); S.toast = ''; S.undo = null; render(); return }
  if ('next' in d) { const it = T().items.find(i => i.id === p.open); if (p.step < FLOWS[it.flow].steps.length - 1) { p.step++; render() } else { p.st[it.id] = T().after[it.flow] ?? 'done'; (p.acted ||= {})[it.id] = true; render() } return }
  if (d.restore) { p.st[d.restore] = 'needs'; p.step = 0; render(); toast('Back in your list'); return }
  if (d.toast) { toast(d.toast); return }
})
