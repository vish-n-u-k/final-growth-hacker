<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tool Header Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff; --bg-soft: #eef1ee; --card: #ffffff; --line: #dfe4df;
    --text: #16201a; --text-dim: #4c5a50; --text-faint: #6f7c72;
    --green: #15803d; --accent: #e3f3e8; --accent-fg: #0f5a2b;
    --warn: #b45309; --warn-soft: #fdf0dc; --frekto: #0d9488; --frekto-soft: #e6f6f4;
    --shadow: 0 8px 28px rgba(16, 32, 22, .12);
    --display: 'Fraunces', Georgia, serif; --body: 'Outfit', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ece9; color: var(--text); font-family: var(--body); }

  /* ── Mockup controls (not part of the app) ── */
  .ctl { position: sticky; top: 0; z-index: 50; background: #1d2620; color: #e8f0ea; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  .ctl h1 { font: 600 15px var(--body); margin: 0 12px 0 0; }
  .ctl .grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .ctl .lbl { font-size: 12px; color: #9fb0a5; margin-right: 4px; }
  .ctl button { font: 500 13px var(--body); border: 1px solid #3a4a40; background: transparent; color: #e8f0ea; padding: 6px 11px; border-radius: 8px; cursor: pointer; }
  .ctl button[aria-pressed="true"] { background: #e8f0ea; color: #16201a; border-color: #e8f0ea; }
  .note { max-width: 1180px; margin: 14px auto 0; padding: 0 20px; font-size: 13.5px; color: #3c4a41; line-height: 1.5; }
  .note b { color: #16201a; }

  /* ── App frame ── */
  .frame { max-width: 1180px; margin: 14px auto 40px; background: var(--bg); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.08); display: flex; min-height: 760px; transition: max-width .2s; }
  .frame.phone { max-width: 390px; }
  .side { width: 200px; flex: none; background: var(--bg-soft); border-right: 1px solid var(--line); padding: 16px 12px; font-size: 13px; }
  .frame.phone .side { display: none; }
  .side .logo { font: 600 15px var(--display); display: flex; gap: 8px; align-items: center; margin: 0 6px 18px; }
  .side .logo i { width: 20px; height: 20px; border-radius: 6px; background: var(--green); display: inline-block; }
  .side .g { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); margin: 16px 8px 6px; }
  .side a { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; color: var(--text-dim); text-decoration: none; }
  .side a.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .main { flex: 1; min-width: 0; padding: 0 32px 40px; position: relative; }
  .frame.phone .main { padding: 0 16px 32px; }

  /* ── BEFORE: today's header ── */
  .old-hd { padding: 32px 0 20px; margin-bottom: 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .old-hd h1 { font: 600 28px/1.15 var(--display); margin: 0; letter-spacing: -.5px; }
  .old-hd p { margin: 6px 0 0; color: var(--text-dim); font-size: 13.5px; max-width: 620px; }
  .old-intro { border: 1px solid #cfe3d6; border-radius: 16px; padding: 22px 24px; margin-bottom: 24px; background: linear-gradient(135deg, #eef7f1, #fff 65%); }
  .old-intro .ey { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--accent-fg); text-transform: uppercase; }
  .old-intro .w { font: 600 19px/1.35 var(--display); margin: 5px 0 18px; }
  .old-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .frame.phone .old-steps { grid-template-columns: 1fr; }
  .old-steps div { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fff; font-size: 13px; color: var(--text-dim); }
  .old-steps b { display: block; color: var(--text); margin-bottom: 4px; font-size: 14px; }

  /* ── NEW: compact header (both options) ── */
  .hd { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
        display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap;
        padding: 14px 0; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .hd-l { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .hd-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); flex: none; }
  .hd h1 { font: 600 20px/1.2 var(--display); margin: 0; letter-spacing: -.2px; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--bg-soft); color: var(--text-dim); white-space: nowrap; }
  .chip.on { background: var(--accent); color: var(--accent-fg); }
  .chip.on::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.frekto { background: var(--frekto-soft); color: var(--frekto); }
  .meta { font-size: 12.5px; color: var(--text-faint); white-space: nowrap; }
  .q { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--text-dim); font: 700 12px var(--body); cursor: pointer; display: grid; place-items: center; position: relative; }
  .q:hover, .q[aria-expanded="true"] { border-color: var(--green); color: var(--green); }
  .hd-r { display: flex; gap: 8px; align-items: center; }
  .btn { height: 34px; padding: 0 14px; border-radius: 9px; font: 600 13px var(--body); border: 1px solid var(--line); background: var(--card); color: var(--text-dim); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn.pri { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.icon { width: 34px; padding: 0; justify-content: center; }

  /* "?" popover (option A) */
  .pop { position: absolute; z-index: 20; top: 58px; left: 0; width: min(440px, calc(100% - 8px)); background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; }
  .pop .w { font-size: 14.5px; font-weight: 600; line-height: 1.45; margin: 0 0 12px; }
  .pop ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .pop li { display: flex; gap: 10px; font-size: 13px; color: var(--text-dim); line-height: 1.45; }
  .pop li b { color: var(--text); }
  .num { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
  .pop .ok { margin-top: 12px; font-size: 12.5px; color: var(--accent-fg); font-weight: 600; }
  .pop .first { margin: -4px 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; }

  /* one-line strip (option B) */
  .strip { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--bg-soft); font-size: 13px; color: var(--text-dim); margin: -6px 0 18px; }
  .strip .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip button { border: 0; background: none; font: 600 12.5px var(--body); color: var(--accent-fg); cursor: pointer; white-space: nowrap; padding: 0; }
  .strip .x { color: var(--text-faint); font-size: 16px; line-height: 1; }
  .strip-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: -8px 0 18px; }
  .frame.phone .strip-steps { grid-template-columns: 1fr; }
  .strip-steps div { display: flex; gap: 8px; font-size: 12.5px; color: var(--text-dim); line-height: 1.45; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .strip-steps b { color: var(--text); }
  .frame.phone .strip .t { white-space: normal; }

  /* ── sample page content ── */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .frame.phone .stats { grid-template-columns: repeat(2, 1fr); }
  .stat { background: var(--bg-soft); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 12px; color: var(--text-dim); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
  .tabs span { padding: 9px 12px; font-size: 13.5px; color: var(--text-dim); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs span.on { color: var(--text); font-weight: 600; border-color: var(--green); }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; background: var(--card); }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card p { margin: 0; font-size: 13px; color: var(--text-dim); }
  .row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .row:first-of-type { border-top: 0; }
  .row .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg-soft); color: var(--text-dim); }
  .row .grow { flex: 1; }
  .fold { position: relative; margin: 6px 0 18px; border-top: 2px dashed #e0a3a3; }
  .fold span { position: absolute; right: 0; top: -11px; background: #fff5f5; color: #a33; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
</style>
</head>
<body>

<div class="ctl" role="toolbar" aria-label="Mockup controls">
  <h1>Tool headers — pick one</h1>
  <div class="grp"><span class="lbl">Version</span>
    <button data-v="before">Today</button>
    <button data-v="a">Option A · compact + “?”</button>
    <button data-v="b">Option B · compact + one-line strip</button>
  </div>
  <div class="grp"><span class="lbl">Tool</span>
    <button data-t="leads">Competitor Leads</button>
    <button data-t="search">Search Agent</button>
    <button data-t="social">Social Studio</button>
    <button data-t="reminders">Reminders</button>
  </div>
  <div class="grp"><span class="lbl">Width</span>
    <button data-w="desk">Desktop</button>
    <button data-w="phone">Phone</button>
  </div>
</div>

<p class="note" id="note"></p>

<div class="frame" id="frame">
  <nav class="side" aria-label="Sidebar (mock)">
    <div class="logo"><i></i>GrowJin</div>
    <a>Today</a><a>Growth Path</a>
    <div class="g">Get customers</div><a>Lead Agent</a><a data-nav="leads">Competitor Leads</a><a>Email Outreach</a>
    <div class="g">Get seen</div><a data-nav="search">Search Agent</a><a data-nav="social">Social Studio</a><a>Meta Ads</a>
    <div class="g">Keep track</div><a data-nav="reminders">Reminders</a><a>Analytics</a>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
const ICON = {
  leads: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.4"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.8" cy="8.8" r="5.3"/><path d="M12.7 12.7 17 17"/></svg>',
  social: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><circle cx="7" cy="8" r="1.4"/><path d="M4 14l3.5-3.5L10 13l3-3.5 3 3.5"/></svg>',
  reminders: '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7.5a4 4 0 0 1 8 0c0 3.5 1.2 4.7 1.5 5.3H4.5C4.8 12.2 6 11 6 7.5Z"/><path d="M8.3 15.5a1.8 1.8 0 0 0 3.4 0"/></svg>',
  gear: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>',
}

const TOOLS = {
  leads: {
    title: 'Competitor Leads', chip: ['', 'Beta'], meta: 'Gmail connected',
    oldSub: 'Scan competitor reviews · AI scores each merchant for product fit · generate targeted outreach',
    actions: [['', 'Email Outreach →'], ['pri', 'New scan']],
    what: "Turns a competitor's bad reviews into a list of people to contact. Their unhappy customers are often looking for something like yours.",
    steps: [['Paste a link', "A competitor's Trustpilot or Shopify App Store page."], ['Score reviewers', 'GrowJin reads the 1–3 star reviews and scores how well you fit each one.'], ['Email the best', 'It finds their email and drafts a note; you send it from Gmail.']],
    note: 'Nothing is sent until you approve it.',
    content: () => `
      <div class="card" style="display:flex;align-items:center;gap:10px;padding:11px 14px"><span>Trustpilot · <b>buffer.com</b></span></div>
      <div class="card" style="background:var(--accent);border-color:transparent;color:var(--accent-fg);padding:11px 14px">✓ <b>Done in 52s</b> · 5 good fits · 3 ready to email · 2 need a contact · cost 2¢</div>
      <div class="card"><h3>Maya Chen · Bloom &amp; Twig Florist <span class="tag" style="float:right;background:var(--accent);color:var(--accent-fg)">Fit 9/10</span></h3>
        <p>Designs every post in Canva, then schedules in Buffer. Frekto would do both for her in a minute.</p>
        <div class="row"><span class="grow">✉ maya@bloomandtwig.co</span><button class="btn pri">Review email</button></div></div>
      <div class="card"><h3>Daniel Ortiz · Ortiz Coaching <span class="tag" style="float:right;background:var(--accent);color:var(--accent-fg)">Fit 8/10</span></h3>
        <p>Wants captions written for him; found Buffer's AI assistant generic.</p>
        <div class="row"><span class="grow">✉ daniel@ortizcoaching.com</span><button class="btn pri">Review email</button></div></div>`,
  },
  search: {
    title: 'Search Agent', chip: ['on', 'On · weekly'], meta: 'Last research 2 h ago',
    oldSub: 'Last research 2 h ago.',
    actions: [['', 'Write next draft'], ['pri', 'Run research']], gear: true,
    what: 'Gets you found on Google and in AI answers like ChatGPT: finds what people search for, writes posts to rank, finds sites that should link to you, and tracks the results.',
    steps: [['Pick searches', 'It picks searches you can realistically win.'], ['Write posts', 'It drafts a post for each one for you to review.'], ['Get links & track', 'It finds link opportunities and checks your Google and AI rank weekly.']],
    content: () => `
      <div class="stats"><div class="stat"><b>3</b><span>Topics picked</span></div><div class="stat"><b>1</b><span>Drafts to read</span></div><div class="stat"><b>0/9</b><span>AI answers name you</span></div><div class="stat"><b>3</b><span>Things to do</span></div></div>
      <div class="tabs"><span class="on">This week</span><span>Link opportunities (4)</span><span>Google rankings</span><span>AI answers</span></div>
      <div class="card"><h3>What to do next</h3><p>Found by this week's research. The top ones are also on Today.</p>
        <div class="row"><span class="tag">Get listed</span><span class="grow">Get mentioned on techradar.com</span><button class="btn">Done</button></div>
        <div class="row"><span class="tag">Get listed</span><span class="grow">Get mentioned on zapier.com</span><button class="btn">Done</button></div>
      </div>`,
  },
  social: {
    title: 'Social Studio', chip: ['frekto', 'Powered by Frekto'], meta: 'Times in Europe/London',
    oldSub: 'GrowJin plans what to post for Acme Co; Frekto creates and publishes it.',
    actions: [['pri', 'Create a post']], gear: true,
    what: 'Get social posts made and published for you: GrowJin decides what to post, Frekto designs it and publishes it to your accounts.',
    steps: [['Pick an idea', 'GrowJin suggests one from your audit, or you describe your own.'], ['Get a preview', 'Frekto makes the image or video, caption and hashtags.'], ['Approve & publish', 'You pick a time; Frekto publishes it.']],
    note: 'Nothing is posted until you approve it.',
    content: () => `
      <div class="card"><h3>Auto-posting with Frekto</h3><p>On · asks you before anything is posted</p></div>
      <div class="card"><h3>Waiting for your approval (1)</h3><p>Check each post, then schedule it, post it now, or discard it.</p>
        <div class="row"><span class="tag">LinkedIn</span><span class="grow">3 pricing mistakes first-time founders make</span><button class="btn pri">Schedule</button></div></div>
      <div class="card"><h3>Upcoming</h3><div class="row"><span class="tag">Instagram</span><span class="grow">Behind the scenes of our new feature</span><span class="meta">Sat 10:00</span></div></div>`,
  },
  reminders: {
    title: 'Reminders', chip: ['warn', '1 overdue'], meta: '3 recurring · 1 follow-up',
    oldSub: 'Acme Co · 1 change to act on · 1 follow-up · 3 recurring',
    actions: [['pri', '+ Add check']],
    what: 'A to-do list that repeats: jobs you redo every few weeks, like updating a listing, and emails nobody replied to.',
    steps: [['Add a check', 'Pick a suggested one or add your own, and how often.'], ['Get reminded', 'When it is due: here, on Today and in your daily email.'], ['Tick it off', 'The next one is scheduled for you.']],
    content: () => `
      <div class="card"><h3>What changed</h3><p>/pricing lost 40% of its Google clicks · Clicks fell from 120 to 72.</p></div>
      <div class="card"><h3>Overdue checks</h3><div class="row"><span class="tag">Marketplace</span><span class="grow">Update Etsy listings</span><span class="meta">2d overdue</span></div></div>
      <div class="card"><h3>Due this week</h3><div class="row"><span class="tag">Profile</span><span class="grow">Refresh Google Business profile</span><span class="meta">in 3d</span></div></div>`,
  },
}

const NOTES = {
  before: '<b>Today:</b> big serif title, a subtitle, then the “What this does” panel. The tool itself starts about <b>350px down</b> the page (red line), more on phones.',
  a: '<b>Option A (recommended):</b> one slim row: icon, name, status, a <b>“?”</b> that opens the explanation, and the main buttons on the right. It stays pinned while you scroll. On someone’s <b>first visit</b> the “?” card opens by itself once, so new users still get the explanation; after that it’s one click away. Click the “?” to try it.',
  b: '<b>Option B:</b> the same slim row, plus a one-line description under it with “How it works” to expand the 3 steps. Easier to discover than A, but always takes one extra line. The × hides the line for good.',
}

let v = 'a', t = 'leads', w = 'desk', popOpen = true, stripOpen = false, stripHidden = false

const btns = (tool) => [
  ...(tool.gear ? [`<button class="btn icon" aria-label="Settings">${ICON.gear}</button>`] : []),
  ...tool.actions.map(([k, label]) => `<button class="btn ${k}">${label}</button>`),
].join('')

function compactHeader(tool, withQ) {
  return `<header class="hd">
    <div class="hd-l">
      <span class="hd-ic">${ICON[t]}</span>
      <h1>${tool.title}</h1>
      <span class="chip ${tool.chip[0]}">${tool.chip[1]}</span>
      ${withQ ? `<button class="q" id="q" aria-expanded="${popOpen}" aria-label="What this does">?</button>` : ''}
      <span class="meta">${tool.meta}</span>
    </div>
    <div class="hd-r">${btns(tool)}</div>
    ${withQ && popOpen ? `<div class="pop" role="dialog" aria-label="What this does">
      <div class="first">What this does</div>
      <p class="w">${tool.what}</p>
      <ol>${tool.steps.map((s, i) => `<li><span class="num">${i + 1}</span><span><b>${s[0]}.</b> ${s[1]}</span></li>`).join('')}</ol>
      ${tool.note ? `<div class="ok">✓ ${tool.note}</div>` : ''}
    </div>` : ''}
  </header>`
}

function render() {
  const tool = TOOLS[t]
  let html = ''
  if (v === 'before') {
    html = `<div class="old-hd"><div><h1>${tool.title}</h1><p>${tool.oldSub}</p></div><div class="hd-r">${btns(tool)}</div></div>
      <section class="old-intro"><div class="ey">What this does</div><div class="w">${tool.what}</div>
        <div class="old-steps">${tool.steps.map((s, i) => `<div><b>${i + 1} · ${s[0]}</b>${s[1]}</div>`).join('')}</div></section>
      <div class="fold"><span>Tool starts here</span></div>` + tool.content()
  } else if (v === 'a') {
    html = compactHeader(tool, true) + tool.content()
  } else {
    html = compactHeader(tool, false)
    if (!stripHidden) {
      html += `<div class="strip"><span class="t">${tool.what}</span><button id="how">${stripOpen ? 'Hide steps ▴' : 'How it works ▾'}</button><button class="x" id="hide" aria-label="Hide">×</button></div>`
      if (stripOpen) html += `<div class="strip-steps">${tool.steps.map((s, i) => `<div><span class="num">${i + 1}</span><span><b>${s[0]}.</b> ${s[1]}</span></div>`).join('')}</div>`
    }
    html += tool.content()
  }
  document.getElementById('main').innerHTML = html
  document.getElementById('note').innerHTML = NOTES[v]
  document.getElementById('frame').classList.toggle('phone', w === 'phone')
  document.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v))
  document.querySelectorAll('[data-t]').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t))
  document.querySelectorAll('[data-w]').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === w))
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === t))
  const q = document.getElementById('q'); if (q) q.onclick = () => { popOpen = !popOpen; render() }
  const how = document.getElementById('how'); if (how) how.onclick = () => { stripOpen = !stripOpen; render() }
  const hide = document.getElementById('hide'); if (hide) hide.onclick = () => { stripHidden = true; render() }
}

document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { v = b.dataset.v; popOpen = v === 'a'; stripHidden = false; stripOpen = false; render() })
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { t = b.dataset.t; render() })
document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { w = b.dataset.w; render() })
document.addEventListener('keydown', e => { if (e.key === 'Escape' && popOpen) { popOpen = false; render() } })
render()
</script>
</body>
</html>
